prompt_templates:
    - |
        Ряд будинків пронумеровано від 1 до {n_objects} зліва направо.

        У кожному будинку живе людина з унікальною характеристикою в кожній з таких категорій:

        {chosen_attributes_str}

        Ми також знаємо таке:

        {chosen_clues_str}

        Хто має які характеристики і живе в якому будинку?

        Будь ласка, подайте вашу відповідь у вигляді JSON dictionary. Кожен key повинен бути object_X, де X — номер будинку. Кожен value повинен бути списком характеристик із вищевказаних категорій, що належать людині, яка живе в будинку номер X.

        Нижче наведено приклад формату відповіді:

        {solution_template}
    - |
        Ряд будинків пронумеровано від 1 до {n_objects} зліва направо.

        У кожному будинку живе людина з унікальною характеристикою в категорії {chosen_attributes_str}.

        Ми також знаємо таке:

        {chosen_clues_str}

        Хто має які характеристики і живе в якому будинку?

        Будь ласка, подайте вашу відповідь у вигляді JSON dictionary. Кожен key повинен бути object_X, де X — номер будинку. Кожен value повинен бути списком характеристик із вищезазначеної категорії, що належать людині, яка живе в будинку номер X.

        Нижче наведено приклад формату відповіді:

        {solution_template}

