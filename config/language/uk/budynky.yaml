# Config file for generating zebra puzzles in Ukrainian with the houses theme.
# Gender policy: professions use masculine as common gender (standard Ukrainian usage for unknown gender).
# Exception: медсестра (nurse) is a feminine job title used as-is — no natural masculine equivalent is in everyday common
#   use. It collides with "сестра" (the sister red herring), but the two are grammatically distinct clue
#   types, so no real ambiguity results.
# Other categories use gender-neutral forms: "людина, яка X" or "людина з X".
# Nationality descriptions use "людина з [країни]" (person from [country]).

