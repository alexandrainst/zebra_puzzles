# Config file for generating zebra puzzles in Arabic (Modern Standard Arabic) with the "houses" (منازل) theme.
#
# Cases: attribute_cases = [nom, is, is_not] — MSA's three grammatical cases are marked by short-vowel
#   diacritics that ordinary written Arabic (this config included) omits entirely, so nominative/genitive
#   forms of a regular noun are visually IDENTICAL — no oblique case is needed for positional clues even
#   though prepositions (بجانب "next to", إلى يسار/يمين "left/right of", بين "between") do govern genitive.
#   One real exception exists: INDEFINITE accusative nouns (the object of a plain transitive verb) take a
#   visible extra alif (ا) unless they end in ة/ء/ا or are proper nouns — e.g. كلبًا "a dog" vs plain كلب.
#   This config sidesteps that risk entirely by design: possession uses لديه ("has", existential — its
#   complement is grammatically NOMINATIVE, not accusative, so no alif regardless of the noun's ending) and
#   habitual/categorical predicates (drinks, genres, hobbies, fruits) use DEFINITE-generic objects (الشيء,
#   "the thing" = the category) since definite nouns never take the accusative alif either. This also
#   avoids ليس + bare-noun predicates (nationalities/jobs), whose accusative-indefinite ending would be
#   the same risk — replaced with prepositional-phrase predicates (من "from", كـ "as") instead, which don't
#   trigger it. Result: nothing in this config depends on getting that alif ending right per-word.
# Gender: masculine default throughout (matches this repo's precedent). شخص "person" is unambiguously
#   masculine (no Marathi-style risk of an internal agreement mismatch).
# Word-formation: nationalities = "الشخص من [country]" / "من [country]" / "ليس من [country]" (زero-copula
#   equational sentence, prepositional predicate). Jobs = "الشخص الذي يعمل كـ[job]" / "يعمل كـ[job]" / "لا
#   يعمل كـ[job]". Pets = "الشخص الذي لديه [pet]" / "لديه [pet]" / "ليس لديه [pet]" (existential possessive).
#   Drinks/genres/hobbies/fruits = "الشخص الذي ي[verb] ال[thing]" / "ي[verب] ال[thing]" / "لا ي[verb]
#   ال[thing]" (definite-generic object, e.g. "يشرب القهوة" = "drinks [the-]coffee").
# Red herrings need only [nom, is] (no oblique case exists at all here), so none of the
# red_herring_subject_cases/same_herring_templates/double_herring_templates machinery built for
#   Hindi/Marathi is needed — every referring form works unchanged in every syntactic position.
# Dual/plural agreement: not_next_to and the "friends" red herring clue describe exactly two people, using
#   Arabic's dual number (شخصان مختلفان "two different persons", صديقان مقربان "two close friends") — a live,
#   actively-used grammatical number in MSA, not archaic. not_between describes three people, using sound
#   masculine plural agreement for human referents (أشخاص مختلفون, not the non-human/broken-plural pattern).
# Ergativity is not a concern — Arabic is a straightforward nominative-accusative language regardless of
#   tense/aspect, so the Canada red herring safely uses simple past (زار كندا "visited Canada").
# Script: RTL is a rendering concern handled automatically by the display layer, not a string-manipulation
#   one — no special handling needed, verified by reading the generated puzzle output.
# Punctuation: uses Arabic-specific characters not on this repo's existing punctuation-config list — Arabic
#   comma "، " (prompt_comma) and Arabic question mark "؟", which required a small code change to
#   format_datasets.py's question-detection regex (previously only recognised "?", ";", "？"). Arabic's
#   "و" ("and") is technically a bound clitic (glued to the following word, "Xو Y" → "X وY" with no space
#   after و) but this config accepts the framework's default symmetric spacing ("X و Y") as a known, minor
#   stylistic simplification rather than risk a double-space bug engineering around it — flagged, not fixed.
#   Arabic has no distinct sentence-final period or colon, so prompt_full_stop/prompt_colon stay default.
# Numerals: {n_between} is substituted as a bare digit (e.g. "2", not a spelled-out number word), which
#   sidesteps MSA's notoriously complex number-noun gender-reversal agreement rules entirely — those rules
#   apply to spelled words like "ثلاثة", not to a digit placed directly before a plural noun.
# Uncertain forms (flagged for native speaker review): بادجي (budgerigar, transliterated loanword), حشرة
#   العصا (stick insect, a descriptive compound rather than a single confirmed term), كشمش أسود
#   (blackcurrant), فراولة برية (wild strawberry, botanical precision), رنجة (herring, the fish — not
#   commonly known/named in the Arab world), جزر فارو (Faroe Islands, name/demonym-adjacent spelling).

theme: ar_manazil

attribute_cases: [nom, is, is_not]
red_herring_attribute_cases: [nom, is]

prompt_comma: '، '

