# Clues
clues_dict:
    found_at: '{attribute_desc} يعيش في المنزل رقم {i_object}.'
    not_at: '{attribute_desc} لا يعيش في المنزل رقم {i_object}.'
    next_to: '{attribute_desc_1} يعيش بجانب {attribute_desc_2}.'                                                # Requires n_objects > 2, otherwise use not_same_object
    not_next_to: '{attribute_desc_1} لا يعيش بجانب {attribute_desc_2}، وهما شخصان مختلفان.'                      # Requires n_objects > 2, otherwise it cannot be used
    just_left_of: '{attribute_desc_1} يعيش مباشرة إلى يسار {attribute_desc_2}.'                                 # Requires n_objects > 2, otherwise use left_of
    just_right_of: '{attribute_desc_1} يعيش مباشرة إلى يمين {attribute_desc_2}.'                                # Requires n_objects > 2, otherwise use right_of
    left_of: '{attribute_desc_1} يعيش إلى يسار {attribute_desc_2}.'
    right_of: '{attribute_desc_1} يعيش إلى يمين {attribute_desc_2}.'
    same_object: '{attribute_desc_1} {attribute_desc_2}.'                                                      # Requires n_attributes > 1, otherwise it cannot be used
    not_same_object: '{attribute_desc_1} {attribute_desc_2}.'                                                  # Requires n_attributes > 1, otherwise it cannot be used
    between: '{attribute_desc_2} يعيش بين {attribute_desc_1} و{attribute_desc_3}.'                              # Requires n_objects > 2, otherwise it cannot be used
    not_between: '{attribute_desc_1} لا يعيش بين {attribute_desc_2} و{attribute_desc_3}، وهم ثلاثة أشخاص مختلفون.' # Requires n_objects > 2, otherwise it cannot be used
    multiple_between: 'يوجد {n_between} منازل بين {attribute_desc_1} و{attribute_desc_2}.'                      # Requires n_objects > 3, otherwise it cannot be used
    one_between: 'يوجد منزل واحد بين {attribute_desc_1} و{attribute_desc_2}.'                                   # Requires n_objects > 2, otherwise it cannot be used

clue_cases_dict:
    found_at: ['nom']
    not_at: ['nom']
    next_to: ['nom', 'nom']
    not_next_to: ['nom', 'nom']
    just_left_of: ['nom', 'nom']
    just_right_of: ['nom', 'nom']
    left_of: ['nom', 'nom']
    right_of: ['nom', 'nom']
    same_object: ['nom', 'none']
    not_same_object: ['nom', 'none']
    between: ['nom', 'nom', 'nom']
    not_between: ['nom', 'nom', 'nom']
    multiple_between: ['nom', 'nom']
    one_between: ['nom', 'nom']

# Prompt
prompt_and: و

prompt_templates:
    - |
        صف من المنازل مرقم من 1 إلى {n_objects} من اليسار إلى اليمين.

        يعيش في كل منزل شخص لديه صفة فريدة في كل من الفئات التالية:

        {chosen_attributes_str}

        نعرف أيضا ما يلي:

        {chosen_clues_str}

        من لديه أي الصفات ومن يعيش في أي منزل؟

        يرجى تقديم إجابتك على شكل JSON dictionary. يجب أن يكون كل key هو object_X، حيث X هو رقم المنزل. يجب أن تكون كل value قائمة بالصفات من الفئات المذكورة أعلاه التي تخص الشخص الذي يعيش في المنزل رقم X.

        فيما يلي مثال على تنسيق الإجابة:

        {solution_template}
    - |
        صف من المنازل مرقم من 1 إلى {n_objects} من اليسار إلى اليمين.

        يعيش في كل منزل شخص لديه صفة فريدة في فئة {chosen_attributes_str}.

        نعرف أيضا ما يلي:

        {chosen_clues_str}

        ما الصفة التي يمتلكها الشخص الذي يعيش في كل منزل؟

        يرجى تقديم إجابتك على شكل JSON dictionary. يجب أن يكون كل key هو object_X، حيث X هو رقم المنزل. يجب أن تحتوي كل value على الصفة من الفئة المذكورة أعلاه التي تخص الشخص الذي يعيش في المنزل رقم X.

        فيما يلي مثال على تنسيق الإجابة:

        {solution_template}

# Red herrings
red_herring_clues_dict:
    same_herring: '{attribute_desc} {attribute_desc_herring}.'
    next_to_herring: '{attribute_desc} يعيش بجانب {attribute_desc_herring}.'
    double_herring: '{attribute_desc_herring_1} {attribute_desc_herring_2}.'
    fact: '{fact}.'
    object_fact: '{attribute_desc} يعرف أن {fact}.'
    friends: '{attribute_desc} و{attribute_desc_herring} صديقان مقربان.'
    herring_found_at: '{attribute_desc_herring} يعيش في المنزل رقم {i_object}.'
    herring_not_at: '{attribute_desc_herring} لا يعيش في المنزل رقم {i_object}.'

