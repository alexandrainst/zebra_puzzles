prompt_and: ja

prompt_templates:
    - |
        Majad on nummerdatud 1-st {n_objects}-ni vasakult paremale.

        Igas majas elab inimene, kellel on igas järgmises kategoorias unikaalne atribuut:

        {chosen_attributes_str}

        Lisaks teame järgmist:

        {chosen_clues_str}

        Kellel on millised atribuudid ja mis majas ta elab?

        Palun esitage oma vastus JSON sõnastiku kujul. Iga võti peab olema object_X, kus X on maja number. Iga väärtus peab olema loend atribuutidest ülaltoodud kategooriatest, mis kuuluvad majas number X elavale inimesele.

        Järgmine on näide vastuse formaadist:

        {solution_template}
    - |
        Majad on nummerdatud 1-st {n_objects}-ni vasakult paremale.

        Igas majas elab inimene, kellel on kategoorias {chosen_attributes_str} unikaalne atribuut.

        Lisaks teame järgmist:

        {chosen_clues_str}

        Mis atribuut on igal maja elanikul?

        Palun esitage oma vastus JSON sõnastiku kujul. Iga võti peab olema object_X, kus X on maja number. Iga väärtus peab olema loend, mis sisaldab majas number X elava inimese atribuudi kategooriast {chosen_attributes_str}.

        Järgmine on näide vastuse formaadist:

        {solution_template}

prompt_replacements:
    ',.': '.'
    'teab, et mõistatuste lahendamine on lõbus': 'naudib mõistatuste lahendamist'
