clues_dict:
    found_at: '{attribute_desc} elab majas number {i_object}.'
    not_at: '{attribute_desc} ei ela majas number {i_object}.'
    next_to: '{attribute_desc_1} elab {attribute_desc_2} kõrval.'
    not_next_to: '{attribute_desc_1} ei ela {attribute_desc_2} kõrval ning nad ei ole sama inimene.'
    just_left_of: '{attribute_desc_1} elab vahetult {attribute_desc_2} vasakul.'
    just_right_of: '{attribute_desc_1} elab vahetult {attribute_desc_2} paremal.'
    left_of: '{attribute_desc_1} elab {attribute_desc_2} vasakul.'
    right_of: '{attribute_desc_1} elab {attribute_desc_2} paremal.'
    same_object: '{attribute_desc_1} {attribute_desc_2}.'
    not_same_object: '{attribute_desc_1} {attribute_desc_2}.'
    between: '{attribute_desc_2} elab {attribute_desc_1} ja {attribute_desc_3} vahel.'
    not_between: '{attribute_desc_1} ei ela {attribute_desc_2} ja {attribute_desc_3} vahel ning nad on kolm eri inimest.'
    multiple_between: '{attribute_desc_1} ja {attribute_desc_2} vahel on {n_between} maja.'
    one_between: '{attribute_desc_1} ja {attribute_desc_2} vahel on üks maja.'

clue_cases_dict:
    found_at: ['nom']
    not_at: ['nom']
    next_to: ['nom', 'gen']
    not_next_to: ['nom', 'gen']
    just_left_of: ['nom', 'gen']
    just_right_of: ['nom', 'gen']
    left_of: ['nom', 'gen']
    right_of: ['nom', 'gen']
    same_object: ['nom', 'none']
    not_same_object: ['nom', 'none']
    between: ['gen', 'nom', 'gen'] # Exception: The first element here is the second in the clue template (attribute_desc_1 is the first).
    not_between: ['nom', 'gen', 'gen']
    multiple_between: ['gen', 'gen']
    one_between: ['gen', 'gen']

red_herring_clues_dict:
    same_herring: '{attribute_desc} {attribute_desc_herring}.'
    next_to_herring: '{attribute_desc} elab {attribute_desc_herring} kõrval.'
    double_herring: '{attribute_desc_herring_1} {attribute_desc_herring_2}.'
    fact: '{fact}.'
    object_fact: '{attribute_desc} teab, et {fact}.'
    friends: '{attribute_desc} ja {attribute_desc_herring} on head sõbrad.'
    herring_found_at: '{attribute_desc_herring} elab majas number {i_object}.'
    herring_not_at: '{attribute_desc_herring} ei ela majas number {i_object}.'

red_herring_cases_dict:
