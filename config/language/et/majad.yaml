# Config file for generating zebra puzzles in Estonian with the houses theme.
# No grammatical gender — masculine/feminine distinction not marked.
# Genitive (gen) is used after postpositions: kõrval (next to), vasakul (left of),
# paremal (right of), vahel (between).
# Agent nouns ending in -ja have identical nominative and genitive forms.
# Note: multiple_between uses "maja" (gen sg), correct for n=2,3,4; n≥5 may need
# a different numeral agreement form but is unlikely in typical puzzle sizes.
theme: et_majad

attribute_cases: [nom, is, is_not, gen]
red_herring_attribute_cases: [nom, is, gen]

