clues_dict:
    found_at: '{attribute_desc} viu a la casa número {i_object}.'
    not_at: '{attribute_desc} no viu a la casa número {i_object}.'
    next_to: '{attribute_desc_1} viu al costat de {attribute_desc_2}.'
    not_next_to: "{attribute_desc_1} no viu al costat de {attribute_desc_2}, i són persones diferents."
    just_left_of: "{attribute_desc_1} viu immediatament a l'esquerra de {attribute_desc_2}."
    just_right_of: '{attribute_desc_1} viu immediatament a la dreta de {attribute_desc_2}.'
    left_of: "{attribute_desc_1} viu a l'esquerra de {attribute_desc_2}."
    right_of: '{attribute_desc_1} viu a la dreta de {attribute_desc_2}.'
    same_object: '{attribute_desc_1} {attribute_desc_2}.'
    not_same_object: '{attribute_desc_1} {attribute_desc_2}.'
    between: '{attribute_desc_2} viu entre {attribute_desc_1} i {attribute_desc_3}.'
    not_between: '{attribute_desc_1} no viu entre {attribute_desc_2} i {attribute_desc_3}, i són tres persones diferents.'
    multiple_between: 'Entre {attribute_desc_1} i {attribute_desc_2} hi ha {n_between} cases.'
    one_between: 'Entre {attribute_desc_1} i {attribute_desc_2} hi ha una casa.'

clue_cases_dict:
    found_at: ['nom']
    not_at: ['nom']
    next_to: ['nom', 'nom']
    not_next_to: ['nom', 'nom']
    just_left_of: ['nom', 'nom']
    just_right_of: ['nom', 'nom']
    left_of: ['nom', 'nom']
    right_of: ['nom', 'nom']
    same_object: ['nom', 'none']
    not_same_object: ['nom', 'none']
    between: ['nom', 'nom', 'nom']
    not_between: ['nom', 'nom', 'nom']
    multiple_between: ['nom', 'nom']
    one_between: ['nom', 'nom']

red_herring_clues_dict:
    same_herring: '{attribute_desc} {attribute_desc_herring}.'
    next_to_herring: '{attribute_desc} viu al costat de {attribute_desc_herring}.'
    double_herring: '{attribute_desc_herring_1} {attribute_desc_herring_2}.'
    fact: '{fact}.'
    object_fact: '{attribute_desc} sap que {fact}.'
    friends: '{attribute_desc} és molt amic de {attribute_desc_herring}.'
    herring_found_at: '{attribute_desc_herring} viu a la casa número {i_object}.'
    herring_not_at: '{attribute_desc_herring} no viu a la casa número {i_object}.'

red_herring_cases_dict:
    same_herring: ['nom', 'none']
    next_to_herring: ['nom', 'nom']
    double_herring: ['nom', 'none']
    fact: ['none']
    object_fact: ['nom', 'none']
    friends: ['nom', 'nom']
    herring_found_at: ['nom']
    herring_not_at: ['nom']

prompt_and: i

prompt_templates:
    - |
        Una fila de cases està numerada de l'1 al {n_objects} d'esquerra a dreta.

        A cada casa hi viu una persona amb un atribut únic en cadascuna de les categories següents:

        {chosen_attributes_str}

        També sabem el següent:

        {chosen_clues_str}

        Qui té quins atributs i viu a quina casa?

        Sisplau, presenta la teva resposta com un JSON dictionary. Cada key ha de ser object_X, on X és el número de la casa. Cada value ha de ser una llista dels atributs de les categories esmentades que pertanyen a la persona de la casa número X.

        El següent és un exemple del format de resposta:

        {solution_template}
    - |
        Una fila de cases està numerada de l'1 al {n_objects} d'esquerra a dreta.

        A cada casa hi viu una persona amb un atribut únic en la categoria de {chosen_attributes_str}.

        També sabem el següent:

        {chosen_clues_str}

        Quin atribut té la persona que viu a cada casa?

        Sisplau, presenta la teva resposta com un JSON dictionary. Cada key ha de ser object_X, on X és el número de la casa. Cada value ha de ser una llista que contingui l'atribut de la categoria esmentada que pertany a la persona de la casa número X.

        El següent és un exemple del format de resposta:

        {solution_template}

prompt_replacements:
    'de el ': 'del '
    'sap que resoldre trencaclosques és divertit': 'li agrada resoldre trencaclosques'
