# Config file for generating zebra puzzles in Catalan with the houses theme.
# Masculine forms used as common gender throughout (standard Catalan usage for unknown gender).
# Prompt replacement 'de el ' → 'del ' handles the de+article contraction.
# Article elision (de + l' for vowel-initial nouns) is written directly in each form.

theme: ca_cases

attribute_cases: [nom, is, is_not]
red_herring_attribute_cases: [nom, is]

