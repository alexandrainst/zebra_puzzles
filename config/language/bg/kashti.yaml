# Config file for generating zebra puzzles in Bulgarian with the houses theme.
# Gender policy: masculine forms used throughout for unknown-gender persons.
# Prep is the short masculine definite form used after prepositions (до, между, вляво от, вдясно от).
# Feminine/neuter nouns have identical nom and prep forms.

theme: bg_kashti

attribute_cases: [nom, is, is_not, prep]
red_herring_attribute_cases: [nom, is, prep]

