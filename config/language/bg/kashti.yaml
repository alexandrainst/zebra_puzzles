clues_dict:
    found_at: "{attribute_desc} живее в къща номер {i_object}."
    not_at: "{attribute_desc} не живее в къща номер {i_object}."
    next_to: "{attribute_desc_1} живее до {attribute_desc_2}."
    not_next_to: "{attribute_desc_1} не живее до {attribute_desc_2}, и те са различни хора."
    just_left_of: "{attribute_desc_1} живее непосредствено вляво от {attribute_desc_2}."
    just_right_of: "{attribute_desc_1} живее непосредствено вдясно от {attribute_desc_2}."
    left_of: "{attribute_desc_1} живее вляво от {attribute_desc_2}."
    right_of: "{attribute_desc_1} живее вдясно от {attribute_desc_2}."
    same_object: "{attribute_desc_1} {attribute_desc_2}."
    not_same_object: "{attribute_desc_1} {attribute_desc_2}."
    between: "{attribute_desc_2} живее между {attribute_desc_1} и {attribute_desc_3}."
    not_between: "{attribute_desc_1} не живее между {attribute_desc_2} и {attribute_desc_3}, и те са три различни хора."
    multiple_between: "Между {attribute_desc_1} и {attribute_desc_2} има {n_between} къщи."
    one_between: "Между {attribute_desc_1} и {attribute_desc_2} има една къща."

clue_cases_dict:
    found_at: ["nom"]
    not_at: ["nom"]
    next_to: ["nom", "prep"]
    not_next_to: ["nom", "prep"]
    just_left_of: ["nom", "prep"]
    just_right_of: ["nom", "prep"]
    left_of: ["nom", "prep"]
    right_of: ["nom", "prep"]
    same_object: ["nom", "none"]
    not_same_object: ["nom", "none"]
    between: ["prep", "nom", "prep"]
    not_between: ["nom", "prep", "prep"]
    multiple_between: ["prep", "prep"]
    one_between: ["prep", "prep"]

red_herring_clues_dict:
    same_herring: "{attribute_desc} {attribute_desc_herring}."
    next_to_herring: "{attribute_desc} живее до {attribute_desc_herring}."
    double_herring: "{attribute_desc_herring_1} {attribute_desc_herring_2}."
    fact: "{fact}."
    object_fact: "{attribute_desc} знае, че {fact}."
    friends: "{attribute_desc} и {attribute_desc_herring} са добри приятели."
    herring_found_at: "{attribute_desc_herring} живее в къща номер {i_object}."
    herring_not_at: "{attribute_desc_herring} не живее в къща номер {i_object}."

red_herring_cases_dict:
    same_herring: ["nom", "none"]
    next_to_herring: ["nom", "prep"]
    double_herring: ["nom", "none"]
    fact: ["none"]
    object_fact: ["nom", "none"]
    friends: ["nom", "nom"]
    herring_found_at: ["nom"]
    herring_not_at: ["nom"]

prompt_templates:
    - |
        Редица от съседни къщи има номера от 1 до {n_objects} отляво надясно.

        Във всяка къща живее човек с уникален атрибут във всяка от следните категории:

        {chosen_attributes_str}

        Знаем и следното:

        {chosen_clues_str}

        Кой притежава кои атрибути и живее в коя къща?

        Моля, изпратете отговора си под формата на JSON речник. Всеки ключ трябва да бъде object_X, където X е номерът на къщата. Всяка стойност трябва да бъде списък от атрибутите от горепосочените категории, принадлежащи на лицето, живеещо в къща номер X.

        Следва пример за формата на отговора:

        {solution_template}
    - |
        Редица от съседни къщи има номера от 1 до {n_objects} отляво надясно.

        Във всяка къща живее човек с уникален атрибут в категорията {chosen_attributes_str}.

        Знаем и следното:

        {chosen_clues_str}

        Кои атрибути принадлежат на лицето, живеещо във всяка от къщите?

        Моля, изпратете отговора си под формата на JSON речник. Всеки ключ трябва да бъде object_X, където X е номерът на къщата. Всяка стойност трябва да бъде списък, съдържащ атрибута от горепосочената категория, принадлежащ на лицето, живеещо в къща номер X.

        Следва пример за формата на отговора:

        {solution_template}

prompt_and: "и"

prompt_replacements:
    ',.': '.'
    'знае, че забавно е да се решават пъзели': 'обича да решава пъзели'
