clues_dict:
    found_at: '{attribute_desc} gyvena name nr. {i_object}.'
    not_at: '{attribute_desc} negyvena name nr. {i_object}.'
    next_to: '{attribute_desc_1} gyvena šalia {attribute_desc_2}.'
    not_next_to: '{attribute_desc_1} negyvena šalia {attribute_desc_2}, ir tai skirtingi žmonės.'
    just_left_of: '{attribute_desc_1} gyvena tiesiog kairėje nuo {attribute_desc_2}.'
    just_right_of: '{attribute_desc_1} gyvena tiesiog dešinėje nuo {attribute_desc_2}.'
    left_of: '{attribute_desc_1} gyvena kairėje nuo {attribute_desc_2}.'
    right_of: '{attribute_desc_1} gyvena dešinėje nuo {attribute_desc_2}.'
    same_object: '{attribute_desc_1} {attribute_desc_2}.'
    not_same_object: '{attribute_desc_1} {attribute_desc_2}.'
    between: '{attribute_desc_2} gyvena tarp {attribute_desc_1} ir {attribute_desc_3}.'
    not_between: '{attribute_desc_1} negyvena tarp {attribute_desc_2} ir {attribute_desc_3}, ir tai trys skirtingi žmonės.'
    multiple_between: 'Tarp {attribute_desc_1} ir {attribute_desc_2} yra {n_between} namai.'
    one_between: 'Tarp {attribute_desc_1} ir {attribute_desc_2} yra vienas namas.'

