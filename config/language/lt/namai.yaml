    herring_not_at: '{attribute_desc_herring} negyvena name nr. {i_object}.'

red_herring_cases_dict:
    same_herring: ['nom', 'none']
    next_to_herring: ['nom', 'gen']
    double_herring: ['nom', 'none']
    fact: ['none']
    object_fact: ['nom', 'none']
    friends: ['nom', 'nom']
    herring_found_at: ['nom']
    herring_not_at: ['nom']

prompt_and: ir

prompt_templates:
    - |
        Namų eilė yra sunumeruota nuo 1 iki {n_objects} iš kairės į dešinę.

        Kiekviename name gyvena žmogus, turintis unikalų požymį kiekvienoje iš šių kategorijų:

        {chosen_attributes_str}

        Taip pat žinome šiuos dalykus:

        {chosen_clues_str}

        Kas turi kokius požymius ir kuriame name gyvena?

        Prašome pateikti atsakymą kaip JSON žodyną. Kiekvienas raktas turi būti object_X, kur X yra namo numeris. Kiekviena reikšmė turi būti aukščiau paminėtų kategorijų požymių, priklausančių name nr. X gyvenančiam žmogui, sąrašas.

        Toliau pateikiamas atsakymo formato pavyzdys:

        {solution_template}
    - |
        Namų eilė yra sunumeruota nuo 1 iki {n_objects} iš kairės į dešinę.

        Kiekviename name gyvena žmogus, turintis unikalų požymį kategorijoje {chosen_attributes_str}.

        Taip pat žinome šiuos dalykus:

        {chosen_clues_str}

        Kokie požymiai priklauso kiekviename name gyvenančiam žmogui?

        Prašome pateikti atsakymą kaip JSON žodyną. Kiekvienas raktas turi būti object_X, kur X yra namo numeris. Kiekviena reikšmė turi būti sąrašas, kuriame yra aukščiau paminėtos kategorijos požymis, priklausantis name nr. X gyvenančiam žmogui.

        Toliau pateikiamas atsakymo formato pavyzdys:

        {solution_template}

prompt_replacements:
    'žino, kad spręsti galvosūkius yra smagu': 'mėgsta spręsti galvosūkius'
    ',.': '.'
