clues_dict:
    found_at: "{attribute_desc} býva v dome číslo {i_object}."
    not_at: "{attribute_desc} nebýva v dome číslo {i_object}."
    next_to: "{attribute_desc_1} býva vedľa {attribute_desc_2}."
    not_next_to: "{attribute_desc_1} nebýva vedľa {attribute_desc_2}, a sú to rôzne osoby."
    just_left_of: "{attribute_desc_1} býva tesne naľavo od {attribute_desc_2}."
    just_right_of: "{attribute_desc_1} býva tesne napravo od {attribute_desc_2}."
    left_of: "{attribute_desc_1} býva naľavo od {attribute_desc_2}."
    right_of: "{attribute_desc_1} býva napravo od {attribute_desc_2}."
    same_object: "{attribute_desc_1} {attribute_desc_2}."
    not_same_object: "{attribute_desc_1} {attribute_desc_2}."
    between: "{attribute_desc_2} býva medzi {attribute_desc_1} a {attribute_desc_3}."
    not_between: "{attribute_desc_1} nebýva medzi {attribute_desc_2} a {attribute_desc_3}, a sú to tri rôzne osoby."
    multiple_between: "Medzi {attribute_desc_1} a {attribute_desc_2} sú {n_between} domy."
    one_between: "Medzi {attribute_desc_1} a {attribute_desc_2} je jeden dom."

clue_cases_dict:
    found_at: ["nom"]
    not_at: ["nom"]
    next_to: ["nom", "gen"]
    not_next_to: ["nom", "gen"]
    just_left_of: ["nom", "gen"]
    just_right_of: ["nom", "gen"]
    left_of: ["nom", "gen"]
    right_of: ["nom", "gen"]
    same_object: ["nom", "none"]
    not_same_object: ["nom", "none"]
    between: ["inst", "nom", "inst"]
    not_between: ["nom", "inst", "inst"]
    multiple_between: ["inst", "inst"]
    one_between: ["inst", "inst"]

red_herring_clues_dict:
    same_herring: "{attribute_desc} {attribute_desc_herring}."
    next_to_herring: "{attribute_desc} býva vedľa {attribute_desc_herring}."
    double_herring: "{attribute_desc_herring_1} {attribute_desc_herring_2}."
    fact: "{fact}."
    object_fact: "{attribute_desc} vie, že {fact}."
    friends: "{attribute_desc} a {attribute_desc_herring} sú dobrí priatelia."
    herring_found_at: "{attribute_desc_herring} býva v dome číslo {i_object}."
    herring_not_at: "{attribute_desc_herring} nebýva v dome číslo {i_object}."

red_herring_cases_dict:
    same_herring: ["nom", "none"]
    next_to_herring: ["nom", "gen"]
    double_herring: ["nom", "none"]
    fact: ["none"]
    object_fact: ["nom", "none"]
    friends: ["nom", "nom"]
    herring_found_at: ["nom"]
    herring_not_at: ["nom"]

prompt_templates:
    - |
        Rad domov je číslovaný od 1 do {n_objects} zľava doprava.

        V každom dome žije osoba s jedinečnou vlastnosťou v každej z nasledujúcich kategórií:

        {chosen_attributes_str}

        Tiež vieme nasledovné:

        {chosen_clues_str}

        Kto má aké vlastnosti a žije v ktorom dome?

        Prosím, odošlite odpoveď vo forme JSON dictionary. Každý key musí byť object_X, kde X je číslo domu. Každý value musí byť zoznam vlastností z vyššie uvedených kategórií, ktoré patria osobe žijúcej v dome číslo X.

        Nižšie je príklad formátu odpovede:

        {solution_template}
    - |
        Rad domov je číslovaný od 1 do {n_objects} zľava doprava.

        V každom dome žije osoba s jedinečnou vlastnosťou v kategórii {chosen_attributes_str}.

        Tiež vieme nasledovné:

        {chosen_clues_str}

        Aké vlastnosti patria osobe žijúcej v každom dome?

        Prosím, odošlite odpoveď vo forme JSON dictionary. Každý key musí byť object_X, kde X je číslo domu. Každý value musí byť zoznam obsahujúci vlastnosť z vyššie uvedenej kategórie, ktorá patrí osobe žijúcej v dome číslo X.

        Nižšie je príklad formátu odpovede:

        {solution_template}

prompt_and: "a"

prompt_replacements:
    ',.': '.'
