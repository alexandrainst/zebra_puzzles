# Config file for generating zebra puzzles in Slovak with the houses theme.
# Gender policy: masculine forms used throughout for unknown-gender persons.
# Exception: zdravotná sestra (nurse) is a feminine job title used as-is.
# Cases: attribute_cases = [nom, is, is_not, gen, inst]
# Preposition → case: vedľa→gen, od (naľavo/napravo od)→gen, medzi→inst
# Word-formation: nationalities=demonym nouns, pets=majiteľ X-gen / má X-acc,
#   drinks/hobbies/literature/fruits=ten kto [verb] / toho kto / tým kto
# Note: multiple_between uses "domy" (nom pl), correct for n=2,3,4; n≥5 needs "domov" (gen pl).
# Uncertain: limonáda (soda vs lemonade).

theme: sk_domy

attribute_cases: [nom, is, is_not, gen, inst]
red_herring_attribute_cases: [nom, is, gen, inst]

