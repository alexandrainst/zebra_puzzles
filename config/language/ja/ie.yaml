# Clues
clues_dict:
    found_at: '{attribute_desc}は{i_object}番目の家に住んでいます。'
    not_at: '{attribute_desc}は{i_object}番目の家に住んでいません。'
    next_to: '{attribute_desc_1}は{attribute_desc_2}の隣に住んでいます。'                                        # Requires n_objects > 2, otherwise use not_same_object
    not_next_to: '{attribute_desc_1}は{attribute_desc_2}の隣に住んでおらず、二人は別の人です。'                    # Requires n_objects > 2, otherwise it cannot be used
    just_left_of: '{attribute_desc_1}は{attribute_desc_2}のすぐ左に住んでいます。'                                # Requires n_objects > 2, otherwise use left_of
    just_right_of: '{attribute_desc_1}は{attribute_desc_2}のすぐ右に住んでいます。'                               # Requires n_objects > 2, otherwise use right_of
    left_of: '{attribute_desc_1}は{attribute_desc_2}の左に住んでいます。'
    right_of: '{attribute_desc_1}は{attribute_desc_2}の右に住んでいます。'
    same_object: '{attribute_desc_1}は{attribute_desc_2}。'                                                     # Requires n_attributes > 1, otherwise it cannot be used
    not_same_object: '{attribute_desc_1}は{attribute_desc_2}。'                                                 # Requires n_attributes > 1, otherwise it cannot be used
    between: '{attribute_desc_2}は{attribute_desc_1}と{attribute_desc_3}の間に住んでいます。'                     # Requires n_objects > 2, otherwise it cannot be used
    not_between: '{attribute_desc_1}は{attribute_desc_2}と{attribute_desc_3}の間に住んでおらず、三人は別々の人です。' # Requires n_objects > 2, otherwise it cannot be used
    multiple_between: '{attribute_desc_1}と{attribute_desc_2}の間には{n_between}軒の家があります。'                # Requires n_objects > 3, otherwise it cannot be used
    one_between: '{attribute_desc_1}と{attribute_desc_2}の間には家が1軒あります。'                                # Requires n_objects > 2, otherwise it cannot be used

clue_cases_dict:
    found_at: ['nom']
    not_at: ['nom']
    next_to: ['nom', 'nom']
    not_next_to: ['nom', 'nom']
    just_left_of: ['nom', 'nom']
    just_right_of: ['nom', 'nom']
    left_of: ['nom', 'nom']
    right_of: ['nom', 'nom']
    same_object: ['nom', 'none']
    not_same_object: ['nom', 'none']
    between: ['nom', 'nom', 'nom']
    not_between: ['nom', 'nom', 'nom']
    multiple_between: ['nom', 'nom']
    one_between: ['nom', 'nom']

# Prompt
prompt_and: と

prompt_templates:
    - |
        家が1番から{n_objects}番まで左から右に並んでいます。

        それぞれの家には、次の各カテゴリーにおいて他と異なる特徴を持つ人が住んでいます。

        {chosen_attributes_str}

        さらに、次のことが分かっています。

        {chosen_clues_str}

        誰がどの特徴を持ち、どの家に住んでいるでしょうか？

        答えはJSON dictionaryとして提出してください。各keyはobject_Xとし、Xは家の番号です。各valueは、X番目の家に住んでいる人が持つ、前述のカテゴリーの特徴のリストにしてください。

        以下は回答形式の例です。

        {solution_template}
    - |
        家が1番から{n_objects}番まで左から右に並んでいます。

        それぞれの家には、{chosen_attributes_str}のカテゴリーにおいて他と異なる特徴を持つ人が住んでいます。

        さらに、次のことが分かっています。

        {chosen_clues_str}

        それぞれの家に住んでいる人はどの特徴を持っているでしょうか？

        答えはJSON dictionaryとして提出してください。各keyはobject_Xとし、Xは家の番号です。各valueは、X番目の家に住んでいる人が持つ、前述のカテゴリーの特徴を含むリストにしてください。

        以下は回答形式の例です。

        {solution_template}

# Red herrings
red_herring_clues_dict:
    same_herring: '{attribute_desc}は{attribute_desc_herring}。'
    next_to_herring: '{attribute_desc}は{attribute_desc_herring}の隣に住んでいます。'
    double_herring: '{attribute_desc_herring_1}は{attribute_desc_herring_2}。'
    fact: '{fact}。'
    object_fact: '{attribute_desc}は{fact}と知っています。'
    friends: '{attribute_desc}と{attribute_desc_herring}は仲良しです。'
    herring_found_at: '{attribute_desc_herring}は{i_object}番目の家に住んでいます。'
    herring_not_at: '{attribute_desc_herring}は{i_object}番目の家に住んでいません。'

