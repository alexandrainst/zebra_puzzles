clues_dict:
    found_at: '{attribute_desc} mieszka w domu numer {i_object}.'
    not_at: '{attribute_desc} nie mieszka w domu numer {i_object}.'
    next_to: '{attribute_desc_1} mieszka obok {attribute_desc_2}.'
    not_next_to: '{attribute_desc_1} nie mieszka obok {attribute_desc_2}, i to są różne osoby.'
    just_left_of: '{attribute_desc_1} mieszka bezpośrednio na lewo od {attribute_desc_2}.'
    just_right_of: '{attribute_desc_1} mieszka bezpośrednio na prawo od {attribute_desc_2}.'
    left_of: '{attribute_desc_1} mieszka na lewo od {attribute_desc_2}.'
    right_of: '{attribute_desc_1} mieszka na prawo od {attribute_desc_2}.'
    same_object: '{attribute_desc_1} {attribute_desc_2}.'
    not_same_object: '{attribute_desc_1} {attribute_desc_2}.'
    between: '{attribute_desc_2} mieszka między {attribute_desc_1} a {attribute_desc_3}.'
    not_between: '{attribute_desc_1} nie mieszka między {attribute_desc_2} a {attribute_desc_3}, i to są trzy różne osoby.'
    multiple_between: 'Między {attribute_desc_1} a {attribute_desc_2} są {n_between} domy.'
    one_between: 'Między {attribute_desc_1} a {attribute_desc_2} jest jeden dom.'

