prompt_templates:
    - |
        Rząd domów jest ponumerowany od 1 do {n_objects} od lewej do prawej.

        W każdym domu mieszka osoba z unikalną cechą w każdej z następujących kategorii:

        {chosen_attributes_str}

        Wiemy również co następuje:

        {chosen_clues_str}

        Kto ma jakie cechy i mieszka w którym domu?

        Proszę podać odpowiedź w formie JSON dictionary. Każdy key powinien być object_X, gdzie X jest numerem domu. Każdy value powinien być listą cech z powyższych kategorii należących do osoby zamieszkałej w domu numer X.

        Poniżej znajduje się przykład formatu odpowiedzi:

        {solution_template}
    - |
        Rząd domów jest ponumerowany od 1 do {n_objects} od lewej do prawej.

        W każdym domu mieszka osoba z unikalną cechą w kategorii {chosen_attributes_str}.

        Wiemy również co następuje:

        {chosen_clues_str}

        Kto ma jakie cechy i mieszka w którym domu?

        Proszę podać odpowiedź w formie JSON dictionary. Każdy key powinien być object_X, gdzie X jest numerem domu. Każdy value powinien być listą z cechą z powyższej kategorii należącą do osoby zamieszkałej w domu numer X.

        Poniżej znajduje się przykład formatu odpowiedzi:

        {solution_template}

prompt_and: 'i'

prompt_replacements:
    'wie, że rozwiązywanie zagadek jest ciekawe': 'uważa, że rozwiązywanie zagadek jest ciekawe'
