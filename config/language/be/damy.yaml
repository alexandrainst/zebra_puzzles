prompt_templates:
    - |
        Шэраг дамоў пранумараваны ад 1 да {n_objects} злева направа.

        У кожным доме жыве чалавек з унікальнай характарыстыкай у кожнай з наступных катэгорый:

        {chosen_attributes_str}

        Мы таксама ведаем наступнае:

        {chosen_clues_str}

        Хто якімі характарыстыкамі валодае і ў якім доме жыве?

        Калі ласка, дайце адказ у выглядзе JSON dictionary. Кожны key павінен быць object_X, дзе X — нумар дома. Кожны value павінен быць спісам характарыстык з вышэйпаказаных катэгорый, якія адносяцца да чалавека ў доме нумар X.

        Ніжэй прыведзены прыклад фармату адказу:

        {solution_template}
    - |
        Шэраг дамоў пранумараваны ад 1 да {n_objects} злева направа.

        У кожным доме жыве чалавек з унікальнай характарыстыкай у катэгорыі {chosen_attributes_str}.

        Мы таксама ведаем наступнае:

        {chosen_clues_str}

        Хто якімі характарыстыкамі валодае і ў якім доме жыве?

        Калі ласка, дайце адказ у выглядзе JSON dictionary. Кожны key павінен быць object_X, дзе X — нумар дома. Кожны value павінен быць спісам з характарыстыкай з вышэйпаказанай катэгорыі, якая адносіцца да чалавека ў доме нумар X.

        Ніжэй прыведзены прыклад фармату адказу:

        {solution_template}

