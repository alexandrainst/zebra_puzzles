# Config file for generating zebra puzzles in Belarusian with the houses theme.
# Nationalities and professions use masculine nouns as common gender (standard Belarusian usage,
# understood as gender-neutral in context). "медык" is genuinely gender-neutral.
# Activity attributes (drinks, hobbies, books, fruits) use "чалавек, які X" (person who X).
# Preliminary version — case forms and vocabulary should be reviewed by a native speaker.
# Note: multiple_between uses "дамы" (gen sg), valid for n=2–4. For n≥5 "дамоў" (gen pl) would be needed.

theme: be_damy

attribute_cases: [nom, is, is_not, gen, inst]
red_herring_attribute_cases: [nom, is, gen, inst]

