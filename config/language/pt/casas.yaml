clues_dict:
    found_at: "{attribute_desc} mora na casa número {i_object}."
    not_at: "{attribute_desc} não mora na casa número {i_object}."
    next_to: "{attribute_desc_1} mora ao lado de {attribute_desc_2}."
    not_next_to: "{attribute_desc_1} não mora ao lado de {attribute_desc_2}, e são pessoas diferentes."
    just_left_of: "{attribute_desc_1} mora imediatamente à esquerda de {attribute_desc_2}."
    just_right_of: "{attribute_desc_1} mora imediatamente à direita de {attribute_desc_2}."
    left_of: "{attribute_desc_1} mora à esquerda de {attribute_desc_2}."
    right_of: "{attribute_desc_1} mora à direita de {attribute_desc_2}."
    same_object: "{attribute_desc_1} {attribute_desc_2}."
    not_same_object: "{attribute_desc_1} {attribute_desc_2}."
    between: "{attribute_desc_2} mora entre {attribute_desc_1} e {attribute_desc_3}."
    not_between: "{attribute_desc_1} não mora entre {attribute_desc_2} e {attribute_desc_3}, e os três são pessoas diferentes."
    multiple_between: "Há {n_between} casas entre {attribute_desc_1} e {attribute_desc_2}."
    one_between: "Há uma casa entre {attribute_desc_1} e {attribute_desc_2}."

clue_cases_dict:
    found_at: ["nom"]
    not_at: ["nom"]
    next_to: ["nom", "nom"]
    not_next_to: ["nom", "nom"]
    just_left_of: ["nom", "nom"]
    just_right_of: ["nom", "nom"]
    left_of: ["nom", "nom"]
    right_of: ["nom", "nom"]
    same_object: ["nom", "none"]
    not_same_object: ["nom", "none"]
    between: ["nom", "nom", "nom"]
    not_between: ["nom", "nom", "nom"]
    multiple_between: ["nom", "nom"]
    one_between: ["nom", "nom"]

red_herring_clues_dict:
    same_herring: "{attribute_desc} {attribute_desc_herring}."
    next_to_herring: "{attribute_desc} mora ao lado de {attribute_desc_herring}."
    double_herring: "{attribute_desc_herring_1} {attribute_desc_herring_2}."
    fact: "{fact}."
    object_fact: "{attribute_desc} sabe que {fact}."
    friends: "{attribute_desc} e {attribute_desc_herring} são muito próximos."
    herring_found_at: "{attribute_desc_herring} mora na casa número {i_object}."
    herring_not_at: "{attribute_desc_herring} não mora na casa número {i_object}."

red_herring_cases_dict:
    same_herring: ["nom", "none"]
    next_to_herring: ["nom", "nom"]
    double_herring: ["nom", "none"]
    fact: ["none"]
    object_fact: ["nom", "none"]
    friends: ["nom", "nom"]
    herring_found_at: ["nom"]
    herring_not_at: ["nom"]

prompt_templates:
    - |
        Uma fila de casas tem os números 1 a {n_objects} da esquerda para a direita.

        Em cada casa vive uma pessoa com um atributo único em cada uma das seguintes categorias:

        {chosen_attributes_str}

        Também sabemos o seguinte:

        {chosen_clues_str}

        Quem tem quais atributos e vive em qual casa?

        Por favor, submeta a sua resposta na forma de um dicionário JSON. Cada chave deve ser object_X, onde X é o número da casa. Cada valor deve ser uma lista dos atributos das categorias mencionadas acima pertencentes à pessoa que vive na casa número X.

        Aqui está um exemplo do formato da resposta:

        {solution_template}
    - |
        Uma fila de casas tem os números 1 a {n_objects} da esquerda para a direita.

        Em cada casa vive uma pessoa com um atributo único na seguinte categoria: {chosen_attributes_str}.

        Também sabemos o seguinte:

        {chosen_clues_str}

        Quais atributos pertencem à pessoa que vive em cada casa?

        Por favor, submeta a sua resposta na forma de um dicionário JSON. Cada chave deve ser object_X, onde X é o número da casa. Cada valor deve ser uma lista contendo o atributo da categoria mencionada acima pertencente à pessoa que vive na casa número X.

        Aqui está um exemplo do formato da resposta:

        {solution_template}

prompt_and: "e"

prompt_replacements:
    "de o ": "do "
