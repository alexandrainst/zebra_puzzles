# Clues
clues_dict:
    found_at: '{attribute_desc}住在{i_object}号房子。'
    not_at: '{attribute_desc}不住在{i_object}号房子。'
    next_to: '{attribute_desc_1}住在{attribute_desc_2}隔壁。'                                                    # Requires n_objects > 2, otherwise use not_same_object
    not_next_to: '{attribute_desc_1}不住在{attribute_desc_2}隔壁，而且他们是两个不同的人。'                        # Requires n_objects > 2, otherwise it cannot be used
    just_left_of: '{attribute_desc_1}紧挨着{attribute_desc_2}的左边。'                                           # Requires n_objects > 2, otherwise use left_of
    just_right_of: '{attribute_desc_1}紧挨着{attribute_desc_2}的右边。'                                          # Requires n_objects > 2, otherwise use right_of
    left_of: '{attribute_desc_1}住在{attribute_desc_2}的左边。'
    right_of: '{attribute_desc_1}住在{attribute_desc_2}的右边。'
    same_object: '{attribute_desc_1}{attribute_desc_2}。'                                                       # Requires n_attributes > 1, otherwise it cannot be used
    not_same_object: '{attribute_desc_1}{attribute_desc_2}。'                                                   # Requires n_attributes > 1, otherwise it cannot be used
    between: '{attribute_desc_2}住在{attribute_desc_1}和{attribute_desc_3}之间。'                                # Requires n_objects > 2, otherwise it cannot be used
    not_between: '{attribute_desc_1}不住在{attribute_desc_2}和{attribute_desc_3}之间，而且他们是三个不同的人。'    # Requires n_objects > 2, otherwise it cannot be used
    multiple_between: '{attribute_desc_1}和{attribute_desc_2}之间有{n_between}栋房子。'                          # Requires n_objects > 3, otherwise it cannot be used
    one_between: '{attribute_desc_1}和{attribute_desc_2}之间有一栋房子。'                                        # Requires n_objects > 2, otherwise it cannot be used

clue_cases_dict:
    found_at: ['nom']
    not_at: ['nom']
    next_to: ['nom', 'nom']
    not_next_to: ['nom', 'nom']
    just_left_of: ['nom', 'nom']
    just_right_of: ['nom', 'nom']
    left_of: ['nom', 'nom']
    right_of: ['nom', 'nom']
    same_object: ['nom', 'none']
    not_same_object: ['nom', 'none']
    between: ['nom', 'nom', 'nom']
    not_between: ['nom', 'nom', 'nom']
    multiple_between: ['nom', 'nom']
    one_between: ['nom', 'nom']

# Prompt
prompt_and: 和

prompt_templates:
    - |
        一排房子从左到右编号为1至{n_objects}。

        每栋房子里住着一个人，每个人在以下每个类别中都有一个独特的属性：

        {chosen_attributes_str}

        我们还知道以下信息：

        {chosen_clues_str}

        谁拥有哪些属性，住在哪栋房子里？

        请以JSON字典的形式提交你的答案。每个键必须是object_X，其中X是房子的编号。每个值必须是一个列表，包含前述类别中属于X号房子里的人的属性。

        以下是答案格式的示例：

        {solution_template}
    - |
        一排房子从左到右编号为1至{n_objects}。

        每栋房子里住着一个人，每个人在{chosen_attributes_str}类别中都有一个独特的属性。

        我们还知道以下信息：

        {chosen_clues_str}

        每栋房子里的人分别拥有哪个属性？

        请以JSON字典的形式提交你的答案。每个键必须是object_X，其中X是房子的编号。每个值必须是一个只包含一个属性的列表，即前述类别中属于X号房子里的人的属性。

        以下是答案格式的示例：

        {solution_template}

# Red herrings
red_herring_clues_dict:
    same_herring: '{attribute_desc}{attribute_desc_herring}。'
    next_to_herring: '{attribute_desc}住在{attribute_desc_herring}隔壁。'
    double_herring: '{attribute_desc_herring_1}{attribute_desc_herring_2}。'
    fact: '{fact}。'
    object_fact: '{attribute_desc}知道{fact}。'
    friends: '{attribute_desc}和{attribute_desc_herring}是好朋友。'
    herring_found_at: '{attribute_desc_herring}住在{i_object}号房子。'
    herring_not_at: '{attribute_desc_herring}不住在{i_object}号房子。'

red_herring_cases_dict:
    same_herring: ['nom', 'none']
    next_to_herring: ['nom', 'nom']
    double_herring: ['nom', 'none']
    fact: ['none']
    object_fact: ['nom', 'none']
    friends: ['nom', 'nom']
    herring_found_at: ['nom']
    herring_not_at: ['nom']

