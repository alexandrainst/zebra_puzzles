# Config file for generating zebra puzzles in Hungarian with the houses theme.

theme: hu_hazak

# Hungarian postpositions (mellett, között, bal/jobb oldalán) all take nominative,
# so only three forms are needed: nominative, predicate "is X", predicate "is not X".
attribute_cases: [nom, is, is_not]
red_herring_attribute_cases: [nom, is]

attributes:

    nemzetiségek:
        Dánia: ['a dán', 'dán', 'nem dán']
        Svédország: ['a svéd', 'svéd', 'nem svéd']
        Lettország: ['a lett', 'lett', 'nem lett']
        Franciaország: ['a francia', 'francia', 'nem francia']
        Spanyolország: ['a spanyol', 'spanyol', 'nem spanyol']
        Olaszország: ['az olasz', 'olasz', 'nem olasz']
        Norvégia: ['a norvég', 'norvég', 'nem norvég']
        Feröer-szigetek: ['a feröeri', 'feröeri', 'nem feröeri']
        Hollandia: ['a holland', 'holland', 'nem holland']
        Izland: ['az izlandi', 'izlandi', 'nem izlandi']
        Egyesült Királyság: ['a brit', 'brit', 'nem brit']

    foglalkozások:
        pék: ['a pék', 'pék', 'nem pék']
        miniszter: ['a miniszter', 'miniszter', 'nem miniszter']
        rendőr: ['a rendőr', 'rendőr', 'nem rendőr']
        ápoló: ['az ápoló', 'ápoló', 'nem ápoló']
        tanár: ['a tanár', 'tanár', 'nem tanár']
        szoftverfejlesztő: ['a szoftverfejlesztő', 'szoftverfejlesztő', 'nem szoftverfejlesztő']
        eladó: ['az eladó', 'eladó', 'nem eladó']

    háziállatok:
        macska: ['a macska gazdája', 'macskát tart', 'nem tart macskát']
        kutya: ['a kutya gazdája', 'kutyát tart', 'nem tart kutyát']
        nyúl: ['a nyúl gazdája', 'nyulat tart', 'nem tart nyulat']
        zebra: ['a zebra gazdája', 'zebrát tart', 'nem tart zebrát']
        hullámos papagáj: ['a hullámos papagáj gazdája', 'hullámos papagájt tart', 'nem tart hullámos papagájt']
        csiga: ['a csiga gazdája', 'csigát tart', 'nem tart csigát']
        botsáska: ['a botsáska gazdája', 'botsáskát tart', 'nem tart botsáskát']

    italok:
        gyümölcslé: ['a gyümölcsléivó', 'gyümölcslevet iszik', 'nem iszik gyümölcslevet']
        kávé: ['a kávéivó', 'kávét iszik', 'nem iszik kávét']
        tej: ['a tejivó', 'tejet iszik', 'nem iszik tejet']
        turmix: ['a turmixivó', 'turmixot iszik', 'nem iszik turmixot']
        kakaó: ['a kakaóivó', 'kakaót iszik', 'nem iszik kakaót']
        tea: ['a teaivó', 'teát iszik', 'nem iszik teát']
        szóda: ['a szódaivó', 'szódát iszik', 'nem iszik szódát']

    kedvenc könyvműfajok:
        ismeretterjesztő: ['az ismeretterjesztő-olvasó', 'ismeretterjesztőt olvas', 'nem olvas ismeretterjesztőt']
        krimi: ['a krimiolvasó', 'krimit olvas', 'nem olvas krimit']
        fantasy: ['a fantasyolvasó', 'fantasyt olvas', 'nem olvas fantasyt']
        sci-fi: ['a sci-fi-olvasó', 'sci-fit olvas', 'nem olvas sci-fit']
        horror: ['a horrorolvasó', 'horrorregényt olvas', 'nem olvas horrorregényt']
        költészet: ['a verskedvelő', 'verset olvas', 'nem olvas verset']
        romantikus regény: ['a romantikusregény-olvasó', 'romantikus regényt olvas', 'nem olvas romantikus regényt']

    hobbik:
        bouldering: ['a boulderező', 'boulderezik', 'nem boulderezik']
        festés: ['a festő', 'fest', 'nem fest']
        társasjáték: ['a társasjátékos', 'társasjátékot játszik', 'nem játszik társasjátékot']
        tenisz: ['a teniszező', 'teniszezik', 'nem teniszezik']
        horgolás: ['a horgolásrajongó', 'horgol', 'nem horgol']
        foci: ['a focista', 'focizik', 'nem focizik']
        kézilabda: ['a kézilabdázó', 'kézilabdázik', 'nem kézilabdázik']

    kedvenc gyümölcsök:
        alma: ['az almakedvelő', 'szereti az almát', 'nem szereti az almát']
        körte: ['a körtekedvelő', 'szereti a körtét', 'nem szereti a körtét']
        narancs: ['a narancskedvelő', 'szereti a narancsot', 'nem szereti a narancsot']
        banán: ['a banánkedvelő', 'szereti a banánt', 'nem szereti a banánt']
