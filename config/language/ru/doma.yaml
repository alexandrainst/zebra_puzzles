    next_to_herring: '{attribute_desc} живёт рядом с {attribute_desc_herring}.'
    double_herring: '{attribute_desc_herring_1} {attribute_desc_herring_2}.'
    fact: '{fact}.'
    object_fact: '{attribute_desc} знает, что {fact}.'
    friends: '{attribute_desc} и {attribute_desc_herring} — хорошие друзья.'
    herring_found_at: '{attribute_desc_herring} живёт в доме номер {i_object}.'
    herring_not_at: '{attribute_desc_herring} не живёт в доме номер {i_object}.'

