# Clues
clues_dict:
    found_at: "{attribute_desc} живёт в доме номер {i_object}."
    not_at: "{attribute_desc} не живёт в доме номер {i_object}."
    next_to: "{attribute_desc_1} живёт рядом с {attribute_desc_2}."
    not_next_to: "{attribute_desc_1} не живёт рядом с {attribute_desc_2}, и это разные люди."
    just_left_of: "{attribute_desc_1} живёт сразу слева от {attribute_desc_2}."
    just_right_of: "{attribute_desc_1} живёт сразу справа от {attribute_desc_2}."
    left_of: "{attribute_desc_1} живёт слева от {attribute_desc_2}."
    right_of: "{attribute_desc_1} живёт справа от {attribute_desc_2}."
    same_object: "{attribute_desc_1} {attribute_desc_2}."
    not_same_object: "{attribute_desc_1} {attribute_desc_2}."
    between: "{attribute_desc_2} живёт между {attribute_desc_1} и {attribute_desc_3}."
    not_between: "{attribute_desc_1} не живёт между {attribute_desc_2} и {attribute_desc_3}, и это три разных человека."
    multiple_between: "Между {attribute_desc_1} и {attribute_desc_2} есть {n_between} дома."
    one_between: "Между {attribute_desc_1} и {attribute_desc_2} есть один дом."

clue_cases_dict:
    found_at: ['nom']
    not_at: ['nom']
    next_to: ['nom', 'inst']
    not_next_to: ['nom', 'inst']
    just_left_of: ['nom', 'gen']
    just_right_of: ['nom', 'gen']
    left_of: ['nom', 'gen']
    right_of: ['nom', 'gen']
    same_object: ['nom', 'none']
    not_same_object: ['nom', 'none']
    between: ['inst', 'nom', 'inst']
    not_between: ['nom', 'inst', 'inst']
    multiple_between: ['inst', 'inst']
    one_between: ['inst', 'inst']

# Prompt
prompt_and: и

prompt_templates:
    - |
        Ряд домов пронумерован от 1 до {n_objects} слева направо.

        В каждом доме живёт человек с уникальной характеристикой в каждой из следующих категорий:

        {chosen_attributes_str}

        Мы также знаем следующее:

        {chosen_clues_str}

        Кто обладает какими характеристиками и в каком доме живёт?

        Пожалуйста, отправьте ваш ответ в виде JSON dictionary. Каждый key должен быть object_X, где X — номер дома. Каждое value должно быть списком характеристик из вышеупомянутых категорий, принадлежащих человеку, который живёт в доме номер X.

        Ниже приведён пример формата ответа:

        {solution_template}
    - |
        Ряд домов пронумерован от 1 до {n_objects} слева направо.

        В каждом доме живёт человек с уникальной характеристикой в категории {chosen_attributes_str}.

        Мы также знаем следующее:

        {chosen_clues_str}

        Какая характеристика принадлежит человеку, живущему в каждом доме?

        Пожалуйста, отправьте ваш ответ в виде JSON dictionary. Каждый key должен быть object_X, где X — номер дома. Каждое value должно быть списком, содержащим характеристику из вышеупомянутой категории, принадлежащую человеку, который живёт в доме номер X.

        Ниже приведён пример формата ответа:

        {solution_template}

# Red herrings
