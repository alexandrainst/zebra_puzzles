# Config file for generating zebra puzzles in Czech with the houses theme.
# Gender policy: masculine forms used throughout for unknown-gender persons.
# Exception: zdravotní sestra (nurse) is a feminine job title used as-is.
# Cases: attribute_cases = [nom, is, is_not, gen, inst]
# Preposition → case: vedle→gen, od (vlevo/vpravo od)→gen, mezi→inst
# Word-formation: nationalities=demonym nouns, pets=majitel+gen / má+acc,
#   drinks/hobbies/literature/fruits=ten, kdo [verb], / toho, kdo / tím, kdo
# Negation: accusative used in is_not forms (modern Czech; formal Czech would use genitive).
# Note: multiple_between uses "domy" (nom pl), correct for n=2,3,4; n≥5 needs "domů" (gen pl).

theme: cs_domy

attribute_cases: [nom, is, is_not, gen, inst]
red_herring_attribute_cases: [nom, is, gen, inst]

