clues_dict:
    found_at: "{attribute_desc} bydlí v domě číslo {i_object}."
    not_at: "{attribute_desc} nebydlí v domě číslo {i_object}."
    next_to: "{attribute_desc_1} bydlí vedle {attribute_desc_2}."
    not_next_to: "{attribute_desc_1} nebydlí vedle {attribute_desc_2}, jsou to různé osoby."
    just_left_of: "{attribute_desc_1} bydlí těsně vlevo od {attribute_desc_2}."
    just_right_of: "{attribute_desc_1} bydlí těsně vpravo od {attribute_desc_2}."
    left_of: "{attribute_desc_1} bydlí vlevo od {attribute_desc_2}."
    right_of: "{attribute_desc_1} bydlí vpravo od {attribute_desc_2}."
    same_object: "{attribute_desc_1} {attribute_desc_2}."
    not_same_object: "{attribute_desc_1} {attribute_desc_2}."
    between: "{attribute_desc_2} bydlí mezi {attribute_desc_1} a {attribute_desc_3}."
    not_between: "{attribute_desc_1} nebydlí mezi {attribute_desc_2} a {attribute_desc_3}, jsou to tři různé osoby."
    multiple_between: "Mezi {attribute_desc_1} a {attribute_desc_2} jsou {n_between} domy."
    one_between: "Mezi {attribute_desc_1} a {attribute_desc_2} je jeden dům."

