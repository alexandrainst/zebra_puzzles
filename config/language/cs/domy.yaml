prompt_templates:
    - |
        Řada domů je číslována od 1 do {n_objects} zleva doprava.

        V každém domě žije osoba s jedinečnou vlastností v každé z následujících kategorií:

        {chosen_attributes_str}

        Také víme následující:

        {chosen_clues_str}

        Kdo má jaké vlastnosti a žije v kterém domě?

        Prosím, odešlete odpověď ve formě JSON slovníku. Každý klíč musí být object_X, kde X je číslo domu. Každá hodnota musí být seznam vlastností z výše uvedených kategorií, které patří osobě žijící v domě číslo X.

        Níže je příklad formátu odpovědi:

        {solution_template}
    - |
        Řada domů je číslována od 1 do {n_objects} zleva doprava.

        V každém domě žije osoba s jedinečnou vlastností v kategorii {chosen_attributes_str}.

        Také víme následující:

        {chosen_clues_str}

        Jaké vlastnosti má osoba žijící v každém domě?

        Prosím, odešlete odpověď ve formě JSON slovníku. Každý klíč musí být object_X, kde X je číslo domu. Každá hodnota musí být seznam obsahující vlastnost z výše uvedené kategorie, která patří osobě žijící v domě číslo X.

        Níže je příklad formátu odpovědi:

        {solution_template}

