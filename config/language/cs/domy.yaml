    not_at: ["nom"]
    next_to: ["nom", "gen"]
    not_next_to: ["nom", "gen"]
    just_left_of: ["nom", "gen"]
    just_right_of: ["nom", "gen"]
    left_of: ["nom", "gen"]
    right_of: ["nom", "gen"]
    same_object: ["nom", "none"]
    not_same_object: ["nom", "none"]
    between: ["inst", "nom", "inst"]
    not_between: ["nom", "inst", "inst"]
    multiple_between: ["inst", "inst"]
    one_between: ["inst", "inst"]

