# Clues (SOV/V2 word order like German; positional prepositions govern dative, matching de/Hauser.yaml)
clues_dict:
    found_at: '{attribute_desc} wunnt am Haus Nummer {i_object}.'
    not_at: '{attribute_desc} wunnt net am Haus Nummer {i_object}.'
    next_to: '{attribute_desc_1} wunnt niewent {attribute_desc_2}.'                                                                              # Requires n_objects > 2, otherwise use not_same_object
    not_next_to: '{attribute_desc_1} wunnt net niewent {attribute_desc_2}, an dat sinn net déiselwecht Persoun.'                                 # Requires n_objects > 2, otherwise it cannot be used
    just_left_of: '{attribute_desc_1} wunnt direkt lénks vun {attribute_desc_2}.'                                                                # Requires n_objects > 2, otherwise use left_of
    just_right_of: '{attribute_desc_1} wunnt direkt riets vun {attribute_desc_2}.'                                                               # Requires n_objects > 2, otherwise use right_of
    left_of: '{attribute_desc_1} wunnt lénks vun {attribute_desc_2}.'
    right_of: '{attribute_desc_1} wunnt riets vun {attribute_desc_2}.'
    same_object: '{attribute_desc_1} {attribute_desc_2}.'                                                                                        # Requires n_attributes > 1, otherwise it cannot be used
    not_same_object: '{attribute_desc_1} {attribute_desc_2}.'                                                                                    # Requires n_attributes > 1, otherwise it cannot be used
    between: '{attribute_desc_2} wunnt tëscht {attribute_desc_1} an {attribute_desc_3}.'                                                         # Requires n_objects > 2, otherwise it cannot be used
    not_between: '{attribute_desc_1} wunnt net tëscht {attribute_desc_2} an {attribute_desc_3}, an dat si dräi verschidde Persounen.'            # Requires n_objects > 2, otherwise it cannot be used
    multiple_between: 'Tëscht {attribute_desc_1} an {attribute_desc_2} stinn genee {n_between} Haiser.'                                          # Requires n_objects > 3, otherwise it cannot be used
    one_between: 'Et gëtt een Haus tëscht {attribute_desc_1} an {attribute_desc_2}.'                                                             # Requires n_objects > 2, otherwise it cannot be used

clue_cases_dict:
    found_at: ['nom']
    not_at: ['nom']
    next_to: ['nom', 'dat']
    not_next_to: ['nom', 'dat']
    just_left_of: ['nom', 'dat']
    just_right_of: ['nom', 'dat']
    left_of: ['nom', 'dat']
    right_of: ['nom', 'dat']
    same_object: ['nom', 'none']
    not_same_object: ['nom', 'none']
    between: ['dat', 'nom', 'dat']
    not_between: ['nom', 'dat', 'dat']
    multiple_between: ['dat', 'dat']
    one_between: ['dat', 'dat']

prompt_and: an

prompt_templates:
    - |
        Eng Rei Haiser sinn nummeréiert vun 1 bis {n_objects} vu lénks no riets.

        A jidderengem Haus wunnt genee eng Persoun. D'Awunner hu jeeweils eng Eegeschaft an all enger vun de folgende Kategorien, wou all Eegeschaft nëmmen eemol virkënnt:

        {chosen_attributes_str}

        Doriwwer eraus wësse mir Follgendes:

        {chosen_clues_str}

        Wien huet wéi eng Eegeschaften an wunnt an wéi engem Haus?

        Wgl schéckt Är Äntwert als JSON-Dictionary. All Key soll object_X sinn, wou X d'Hausnummer ass. All Value soll eng Lëscht mat den Eegeschafte vun den uewe genannte Kategorie sinn, déi zu der Persoun am Haus Nummer X gehéieren.

        Hei ass e Beispill vum Äntwertformat:

        {solution_template}
    - |
        Eng Rei Haiser sinn nummeréiert vun 1 bis {n_objects} vu lénks no riets.

        A jidderengem Haus wunnt genee eng Persoun. D'Awunner hu jeeweils eng Eegeschaft an der Kategorie {chosen_attributes_str}.

        Doriwwer eraus wësse mir Follgendes:

        {chosen_clues_str}

        Wéi eng Eegeschaft gehéiert zu der Persoun a jidderengem Haus?

        Wgl schéckt Är Äntwert als JSON-Dictionary. All Key soll object_X sinn, wou X d'Hausnummer ass. All Value soll eng Lëscht sinn, déi d'Eegeschaft aus der genannter Kategorie enthält, déi zu der Persoun am Haus Nummer X gehéiert.

        Hei ass e Beispill vum Äntwertformat:

        {solution_template}

# Red herrings
red_herring_clues_dict:
    same_herring: '{attribute_desc} {attribute_desc_herring}.'
    next_to_herring: '{attribute_desc} wunnt niewent {attribute_desc_herring}.'
    double_herring: '{attribute_desc_herring_1} {attribute_desc_herring_2}.'
    fact: '{fact}.'
    object_fact: '{attribute_desc} weess, datt {fact}.'
    friends: '{attribute_desc} ass gutt befrënnt mat {attribute_desc_herring}.'
    herring_found_at: '{attribute_desc_herring} wunnt am Haus Nummer {i_object}.'
    herring_not_at: '{attribute_desc_herring} wunnt net am Haus Nummer {i_object}.'

red_herring_cases_dict:
