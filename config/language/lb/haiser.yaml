    next_to_herring: ['nom', 'dat']
    double_herring: ['nom', 'none']
    fact: ['none']
    object_fact: ['nom', 'none']
    friends: ['nom', 'dat']
    herring_found_at: ['nom']
    herring_not_at: ['nom']

