# Config file for generating zebra puzzles in Luxembourgish with the classic "houses" theme.
#
# Cases: attribute_cases = [nom, is, is_not, dat]. Unlike German, Luxembourgish articles no longer distinguish
#   nominative from accusative (den/eng/d' serve both), so there is no separate "acc" case — anywhere German's
#   template would use accusative, this config just reuses "nom". Dative is still fully productive (den->dem
#   masc, d'->der fem, d'->dem neut) and is needed after the positional prepositions (niewent, tëscht, lénks
#   vun, riets vun all govern dative), mirroring German's de/Hauser.yaml exactly.
# Gender default: masculine ("de"/"den"/"dem") used throughout for unknown-gender persons, as in German.
# Word-formation (translated 1:1 from German's category structure): nationalities/jobs = bare
#   demonym/occupation noun; pets = "X-besëtzer" (owner) compound + "huet en/eng X"; drinks = "X-drénker"
#   compound + "drénkt X"; book genres = "X-leser" compound + "liest X"; hobbies = agent noun (Klammer,
#   Moler, Heekeler) + verb; fruits = "Fan vun X" + "huet X gär" ("gär hunn" = to like, lit. "to have gladly").
# Uncertain forms (flagged for native speaker review — Luxembourgish orthography/vocabulary confirmed only
#   for "Heekelen" [crochet, via lb.wikipedia.org]; the rest are best-effort German-cognate constructions):
#   Wellesittech (budgerigar), Stabschreck (stick insect, cognate of German "Stabschrecke"), Schleek (snail), Nidderlanden/Nidderlänner
#   (Netherlands/Dutchman — "Holland"/"Hollänner" may be the more natural colloquial choice), Infirmier
#   (nurse, French loanword as commonly used in Luxembourg), Enseignant (teacher, French loanword — native
#   "Schoulmeeschter" may be more natural), Gesellschaftsspiller (board games), the "Eifeler Regel" final-n
#   deletion rule (e.g. "e Kand" vs "ee Buch") is not applied consistently throughout.

theme: lb_haiser

attribute_cases: [nom, is, is_not, dat]
red_herring_attribute_cases: [nom, is, dat]

