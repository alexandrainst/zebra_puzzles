        зајак: ['сопственикот на зајак', 'има зајак', 'нема зајак']
        зебра: ['сопственикот на зебра', 'има зебра', 'нема зебра']
        тигрица: ['сопственикот на тигрица', 'има тигрица', 'нема тигрица']
        полжав: ['сопственикот на полжав', 'има полжав', 'нема полжав']  # uncertain
        стапчест инсект: ['сопственикот на стапчест инсект', 'има стапчест инсект', 'нема стапчест инсект']

    пијалоци:
        сок: ['оној што пие сок', 'пие сок', 'не пие сок']
        кафе: ['оној што пие кафе', 'пие кафе', 'не пие кафе']
        млеко: ['оној што пие млеко', 'пие млеко', 'не пие млеко']
        смути: ['оној што пие смути', 'пие смути', 'не пие смути']
        какао: ['оној што пие какао', 'пие какао', 'не пие какао']
        чај: ['оној што пие чај', 'пие чај', 'не пие чај']
        газиран пијалок: ['оној што пие газиран пијалок', 'пие газиран пијалок', 'не пие газиран пијалок']

    омилени книжни жанрови:
        нехудожествена литература: ['оној што чита нехудожествена литература', 'чита нехудожествена литература', 'не чита нехудожествена литература']
        криминалистички роман: ['оној што чита криминалистички романи', 'чита криминалистички романи', 'не чита криминалистички романи']
        фентези: ['оној што чита фентези', 'чита фентези', 'не чита фентези']
        научна фантастика: ['оној што чита научна фантастика', 'чита научна фантастика', 'не чита научна фантастика']
        хорор: ['оној што чита хорор', 'чита хорор', 'не чита хорор']
        поезија: ['оној што чита поезија', 'чита поезија', 'не чита поезија']
        љубовен роман: ['оној што чита љубовни романи', 'чита љубовни романи', 'не чита љубовни романи']

    хобија:
        боулдеринг: ['оној што се занимава со боулдеринг', 'се занимава со боулдеринг', 'не се занимава со боулдеринг']  # uncertain
        сликање: ['оној што слика', 'слика', 'не слика']
        друштвени игри: ['оној што игра друштвени игри', 'игра друштвени игри', 'не игра друштвени игри']
        тенис: ['оној што игра тенис', 'игра тенис', 'не игра тенис']
        плетење со чингилаче: ['оној што плете со чингилаче', 'плете со чингилаче', 'не плете со чингилаче']  # "чингилаче" is the specific crochet-hook tool (vs. generic "кука" = hook), per mk.wikipedia.org
        фудбал: ['оној што игра фудбал', 'игра фудбал', 'не игра фудбал']
        ракомет: ['оној што игра ракомет', 'игра ракомет', 'не игра ракомет']  # uncertain

    омилени овошја:
        јаболко: ['оној што сака јаболка', 'сака јаболка', 'не сака јаболка']
        круша: ['оној што сака круши', 'сака круши', 'не сака круши']
        портокал: ['оној што сака портокали', 'сака портокали', 'не сака портокали']
        банана: ['оној што сака банани', 'сака банани', 'не сака банани']
        јагода: ['оној што сака јагоди', 'сака јагоди', 'не сака јагоди']
        црна рибизла: ['оној што сака црна рибизла', 'сака црна рибизла', 'не сака црна рибизла']
        шумска јагода: ['оној што сака шумски јагоди', 'сака шумски јагоди', 'не сака шумски јагоди']

clues_dict:
    found_at: '{attribute_desc} живее во куќа број {i_object}.'
    not_at: '{attribute_desc} не живее во куќа број {i_object}.'
    next_to: '{attribute_desc_1} живее до {attribute_desc_2}.'                                                                    # Requires n_objects > 2, otherwise use not_same_object
    not_next_to: '{attribute_desc_1} не живее до {attribute_desc_2}, и тие се различни луѓе.'                                     # Requires n_objects > 2, otherwise it cannot be used
    just_left_of: '{attribute_desc_1} живее веднаш лево од {attribute_desc_2}.'                                                   # Requires n_objects > 2, otherwise use left_of
    just_right_of: '{attribute_desc_1} живее веднаш десно од {attribute_desc_2}.'                                                 # Requires n_objects > 2, otherwise use right_of
    left_of: '{attribute_desc_1} живее лево од {attribute_desc_2}.'
    right_of: '{attribute_desc_1} живее десно од {attribute_desc_2}.'
    same_object: '{attribute_desc_1} {attribute_desc_2}.'                                                                         # Requires n_attributes > 1, otherwise it cannot be used
    not_same_object: '{attribute_desc_1} {attribute_desc_2}.'                                                                     # Requires n_attributes > 1, otherwise it cannot be used
    between: '{attribute_desc_2} живее помеѓу {attribute_desc_1} и {attribute_desc_3}.'                                          # Requires n_objects > 2, otherwise it cannot be used
    not_between: '{attribute_desc_1} не живее помеѓу {attribute_desc_2} и {attribute_desc_3}, и тие се три различни луѓе.'        # Requires n_objects > 2, otherwise it cannot be used
    multiple_between: 'Помеѓу {attribute_desc_1} и {attribute_desc_2} има {n_between} куќи.'                                      # Requires n_objects > 3, otherwise it cannot be used
    one_between: 'Помеѓу {attribute_desc_1} и {attribute_desc_2} има една куќа.'                                                  # Requires n_objects > 2, otherwise it cannot be used

clue_cases_dict:
    found_at: [nom]
    not_at: [nom]
    next_to: [nom, nom]
    not_next_to: [nom, nom]
    just_left_of: [nom, nom]
    just_right_of: [nom, nom]
    left_of: [nom, nom]
    right_of: [nom, nom]
    same_object: [nom, none]
    not_same_object: [nom, none]
    between: [nom, nom, nom]
    not_between: [nom, nom, nom]
    multiple_between: [nom, nom]
    one_between: [nom, nom]

prompt_and: 'и'

prompt_templates:
    - |
        Ред соседни куќи е нумериран од 1 до {n_objects} од лево кон десно.

        Во секоја куќа живее човек со единствен атрибут во секоја од следните категории:

        {chosen_attributes_str}

        Дополнително го знаеме следново:

        {chosen_clues_str}

        Кој ги поседува кои атрибути и во која куќа живее?

        Ве молиме испратете го вашиот одговор како JSON dictionary. Секој key треба да биде object_X, каде X е бројот на куќата. Секој value треба да биде листа од атрибутите од погоре наведените категории кои му припаѓаат на човекот во куќа број X.

        Еве еден пример за форматот на одговорот:

        {solution_template}
    - |
        Ред соседни куќи е нумериран од 1 до {n_objects} од лево кон десно.

        Во секоја куќа живее човек со единствен атрибут во категоријата {chosen_attributes_str}.

        Дополнително го знаеме следново:

        {chosen_clues_str}

        Кои атрибути му припаѓаат на човекот во секоја куќа?

        Ве молиме испратете го вашиот одговор како JSON dictionary. Секој key треба да биде object_X, каде X е бројот на куќата. Секој value треба да биде листа која го содржи атрибутот од наведената категорија кој му припаѓа на човекот во куќа број X.

        Еве еден пример за форматот на одговорот:

        {solution_template}

red_herring_clues_dict:
    same_herring: '{attribute_desc} {attribute_desc_herring}.'
    next_to_herring: '{attribute_desc} живее до {attribute_desc_herring}.'
    double_herring: '{attribute_desc_herring_1} {attribute_desc_herring_2}.'
    fact: '{fact}.'
    object_fact: '{attribute_desc} знае дека {fact}.'
    friends: '{attribute_desc} и {attribute_desc_herring} се добри пријатели.'
    herring_found_at: '{attribute_desc_herring} живее во куќа број {i_object}.'
    herring_not_at: '{attribute_desc_herring} не живее во куќа број {i_object}.'

red_herring_cases_dict:
