# Config file for generating zebra puzzles in Macedonian with the houses theme.
#
# Cases: attribute_cases = [nom, is, is_not] — no separate "prep" case like Bulgarian. Unlike Bulgarian,
#   Macedonian's masculine postpositive definite article (-от) has only ONE form used in every syntactic
#   position (no short/long split after prepositions), so positional clues just reuse "nom" throughout.
# Gender: masculine forms used throughout for unknown-gender persons, as in Bulgarian.
# Word-formation: nationalities/jobs = bare noun + "-от"/"-та" article, "е X"/"не е X"; pets = "сопственикот
#   на X" (owner of X) + "има X"/"нема X"; drinks/book genres/hobbies/fruits = relative clause "оној што
#   [verb] [object]" for nom + bare "[verb] [object]"/"не [verb] [object]" for is/is_not — NOT a participle
#   like Bulgarian's "пиещият"/"четящият", since Macedonian's active present participle is far less
#   productive than Bulgarian's; "оној" is invariant so this needs no extra case either.
# Uncertain forms (flagged for native speaker review — no mk.wikipedia.org article or dictionary entry
#   found): фарец (Faroese demonym — mk.wikipedia.org only gives the adjective "фарски" and the periphrasis
#   "Фарскиот народ", no single-word demonym; derived by analogy with Bulgarian's "фарьорец"), боулдеринг
#   (bouldering, loanword spelling)

theme: mk_kukji

attribute_cases: [nom, is, is_not]
red_herring_attribute_cases: [nom, is]

attributes:

    националности:
        Данска: ['данецот', 'е данец', 'не е данец']
        Шведска: ['швеѓанецот', 'е швеѓанец', 'не е швеѓанец']
        Латвија: ['латвиецот', 'е латвиец', 'не е латвиец']
        Франција: ['французинот', 'е французин', 'не е французин']
        Шпанија: ['шпанецот', 'е шпанец', 'не е шпанец']
        Италија: ['италијанецот', 'е италијанец', 'не е италијанец']
        Норвешка: ['норвежецот', 'е норвежец', 'не е норвежец']
        Фарски Острови: ['фарецот', 'е фарец', 'не е фарец']  # uncertain: mk.wikipedia.org gives the adjective "фарски" and the periphrasis "Фарскиот народ" (the Faroese people) but no single-word demonym; "фарец" derived by analogy with Bulgarian's "фарьорец" (base + -ец, dropping the -ски adjective suffix)
        Холандија: ['холанѓанецот', 'е холанѓанец', 'не е холанѓанец']
        Исланд: ['исландецот', 'е исландец', 'не е исландец']
        Обединето Кралство: ['британецот', 'е британец', 'не е британец']

    професии:
