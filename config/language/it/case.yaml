# Config file for generating zebra puzzles in Italian with the houses theme.

# Cases: attribute_cases = [nom, is, is_not]
# Prepositions: accanto a → nom (article contractions via prompt_replacements), a sinistra/destra di → nom (contractions), tra → nom (no contractions)
# Word-formation: nationalities=article+demonym, occupations=article+noun, pets=il proprietario di un/una X, drinks=chi beve X, hobbies=chi [verb], literature=chi legge X, fruits=chi ama X
# Gender default: masculine throughout
# Uncertain forms (flagged for native speaker review): gassosa (soda)

theme: it_case

attribute_cases: [nom, is, is_not]
red_herring_attribute_cases: [nom, is]

attributes:

