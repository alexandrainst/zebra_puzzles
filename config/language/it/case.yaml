clues_dict:
    found_at: "{attribute_desc} abita nella casa numero {i_object}."
    not_at: "{attribute_desc} non abita nella casa numero {i_object}."
    next_to: "{attribute_desc_1} abita accanto a {attribute_desc_2}."
    not_next_to: "{attribute_desc_1} non abita accanto a {attribute_desc_2}, e sono persone diverse."
    just_left_of: "{attribute_desc_1} abita immediatamente a sinistra di {attribute_desc_2}."
    just_right_of: "{attribute_desc_1} abita immediatamente a destra di {attribute_desc_2}."
    left_of: "{attribute_desc_1} abita a sinistra di {attribute_desc_2}."
    right_of: "{attribute_desc_1} abita a destra di {attribute_desc_2}."
    same_object: "{attribute_desc_1} {attribute_desc_2}."
    not_same_object: "{attribute_desc_1} {attribute_desc_2}."
    between: "{attribute_desc_2} abita tra {attribute_desc_1} e {attribute_desc_3}."
    not_between: "{attribute_desc_1} non abita tra {attribute_desc_2} e {attribute_desc_3}, e sono tre persone diverse."
    multiple_between: "Tra {attribute_desc_1} e {attribute_desc_2} ci sono {n_between} case."
    one_between: "Tra {attribute_desc_1} e {attribute_desc_2} c'è una casa."

clue_cases_dict:
    found_at: ['nom']
    not_at: ['nom']
    next_to: ['nom', 'nom']
    not_next_to: ['nom', 'nom']
    just_left_of: ['nom', 'nom']
    just_right_of: ['nom', 'nom']
    left_of: ['nom', 'nom']
    right_of: ['nom', 'nom']
    same_object: ['nom', 'none']
    not_same_object: ['nom', 'none']
    between: ['nom', 'nom', 'nom']
    not_between: ['nom', 'nom', 'nom']
    multiple_between: ['nom', 'nom']
    one_between: ['nom', 'nom']

red_herring_clues_dict:
    same_herring: "{attribute_desc} {attribute_desc_herring}."
    next_to_herring: "{attribute_desc} abita accanto a {attribute_desc_herring}."
    double_herring: "{attribute_desc_herring_1} {attribute_desc_herring_2}."
    fact: "{fact}."
    object_fact: "{attribute_desc} sa che {fact}."
    friends: "{attribute_desc} e {attribute_desc_herring} sono buoni amici."
    herring_found_at: "{attribute_desc_herring} abita nella casa numero {i_object}."
    herring_not_at: "{attribute_desc_herring} non abita nella casa numero {i_object}."

red_herring_cases_dict:
    same_herring: ['nom', 'none']
    next_to_herring: ['nom', 'nom']
    double_herring: ['nom', 'none']
    fact: ['none']
    object_fact: ['nom', 'none']
    friends: ['nom', 'nom']
    herring_found_at: ['nom']
    herring_not_at: ['nom']

prompt_and: e

prompt_templates:
    - |
        Una fila di case è numerata da 1 a {n_objects} da sinistra a destra.

        In ogni casa abita una persona con attributi unici in ciascuna delle seguenti categorie:

        {chosen_attributes_str}

        Sappiamo anche quanto segue:

        {chosen_clues_str}

        Chi ha quali attributi e abita in quale casa?

        Si prega di inviare la risposta come dizionario JSON. Ogni chiave deve essere object_X, dove X è il numero della casa. Ogni valore deve essere un elenco degli attributi delle categorie indicate che appartengono alla persona che abita nella casa numero X.

        Di seguito è riportato un esempio del formato della risposta:

        {solution_template}
    - |
        Una fila di case è numerata da 1 a {n_objects} da sinistra a destra.

        In ogni casa abita una persona con un attributo unico nella categoria {chosen_attributes_str}.

        Sappiamo anche quanto segue:

        {chosen_clues_str}

        Quali attributi ha la persona che abita in ogni casa?

        Si prega di inviare la risposta come dizionario JSON. Ogni chiave deve essere object_X, dove X è il numero della casa. Ogni valore deve essere un elenco contenente l'attributo della categoria indicata che appartiene alla persona che abita nella casa numero X.

        Di seguito è riportato un esempio del formato della risposta:

        {solution_template}

# Article contractions: "a il" → "al", "di il" → "del", etc.
# Leading space on "a ..." rules prevents spurious matches inside "tra il/lo/l'...".
prompt_replacements:
    'di il ': 'del '
    'di lo ': 'dello '
    'di la ': 'della '
    "di l'": "dell'"
    ' a il ': ' al '
    ' a lo ': ' allo '
    ' a la ': ' alla '
    " a l'": " all'"
