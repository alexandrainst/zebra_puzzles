clues_dict:
    found_at: '{attribute_desc} wennet op hûsnûmer {i_object}.'
    not_at: '{attribute_desc} wennet net op hûsnûmer {i_object}.'
    next_to: '{attribute_desc_1} wennet neist {attribute_desc_2}.'                                                                # Requires n_objects > 2, otherwise use not_same_object
    not_next_to: '{attribute_desc_1} wennet net neist {attribute_desc_2}, en se binne net deselde persoan.'                       # Requires n_objects > 2, otherwise it cannot be used
    just_left_of: '{attribute_desc_1} wennet direkt lofts fan {attribute_desc_2}.'                                                # Requires n_objects > 2, otherwise use left_of
    just_right_of: '{attribute_desc_1} wennet direkt rjochts fan {attribute_desc_2}.'                                             # Requires n_objects > 2, otherwise use right_of
    left_of: '{attribute_desc_1} wennet lofts fan {attribute_desc_2}.'
    right_of: '{attribute_desc_1} wennet rjochts fan {attribute_desc_2}.'
    same_object: '{attribute_desc_1} {attribute_desc_2}.'                                                                         # Requires n_attributes > 1, otherwise it cannot be used
    not_same_object: '{attribute_desc_1} {attribute_desc_2}.'                                                                     # Requires n_attributes > 1, otherwise it cannot be used
    between: '{attribute_desc_2} wennet tusken {attribute_desc_1} en {attribute_desc_3}.'                                        # Requires n_objects > 2, otherwise it cannot be used
    not_between: '{attribute_desc_1} wennet net tusken {attribute_desc_2} en {attribute_desc_3}, en it binne trije ferskillende persoanen.' # Requires n_objects > 2, otherwise it cannot be used
    multiple_between: 'Tusken {attribute_desc_1} en {attribute_desc_2} steane {n_between} hûzen.'                                 # Requires n_objects > 3, otherwise it cannot be used
    one_between: 'Der stiet ien hûs tusken {attribute_desc_1} en {attribute_desc_2}.'                                             # Requires n_objects > 2, otherwise it cannot be used

clue_cases_dict:
    found_at: [nom]
    not_at: [nom]
    next_to: [nom, nom]
    not_next_to: [nom, nom]
    just_left_of: [nom, nom]
    just_right_of: [nom, nom]
    left_of: [nom, nom]
    right_of: [nom, nom]
    same_object: [nom, none]
    not_same_object: [nom, none]
    between: [nom, nom, nom]
    not_between: [nom, nom, nom]
    multiple_between: [nom, nom]
    one_between: [nom, nom]

prompt_and: en

prompt_templates:
    - |
        In rige hûzen is fan links nei rjochts nûmere fan 1 oant {n_objects}.

        Yn elk hûs wennet in persoan mei in unike eigenskip yn elk fan de folgjende kategoryen:

        {chosen_attributes_str}

        Fierders witte we it folgjende:

        {chosen_clues_str}

        Wa hat hokker eigenskippen en wennet yn hokker hûs?

        Jou dyn antwurd as in JSON dictionary. Elke key moat object_X wêze, wêrby't X it hûsnûmer is. Elke value moat in list wêze fan de eigenskippen út de neamde kategoryen dy't by de persoan yn hûs nr. X hearre.

        It folgjende is in foarbyld fan it antwurdformaat:

        {solution_template}
    - |
        In rige hûzen is fan links nei rjochts nûmere fan 1 oant {n_objects}.

        Yn elk hûs wennet in persoan mei in unike eigenskip yn de kategory {chosen_attributes_str}.

        Fierders witte we it folgjende:

        {chosen_clues_str}

        Wa hat hokker eigenskippen en wennet yn hokker hûs?

        Jou dyn antwurd as in JSON dictionary. Elke key moat object_X wêze, wêrby't X it hûsnûmer is. Elke value moat in list wêze mei de eigenskip út de neamde kategory dy't by de persoan yn hûs nr. X heart.

        It folgjende is in foarbyld fan it antwurdformaat:

        {solution_template}

