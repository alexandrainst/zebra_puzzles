clues_dict:
    found_at: 'Tá cónaí ar an {attribute_desc} i dteach uimhir {i_object}.'
    not_at: 'Níl cónaí ar an {attribute_desc} i dteach uimhir {i_object}.'
    next_to: 'Tá cónaí ar an {attribute_desc_1} in aice leis an {attribute_desc_2}.'                                                        # Requires n_objects > 2, otherwise use not_same_object
    not_next_to: 'Níl cónaí ar an {attribute_desc_1} in aice leis an {attribute_desc_2}, agus daoine difriúla iad.'                         # Requires n_objects > 2, otherwise it cannot be used
    just_left_of: 'Tá cónaí ar an {attribute_desc_1} díreach ar chlé den {attribute_desc_2}.'                                               # Requires n_objects > 2, otherwise use left_of
    just_right_of: 'Tá cónaí ar an {attribute_desc_1} díreach ar dheis den {attribute_desc_2}.'                                             # Requires n_objects > 2, otherwise use right_of
    left_of: 'Tá cónaí ar an {attribute_desc_1} ar chlé den {attribute_desc_2}.'
    right_of: 'Tá cónaí ar an {attribute_desc_1} ar dheis den {attribute_desc_2}.'
    same_object: 'Tá an {attribute_desc_1} ina {attribute_desc_2}.'                                                                         # Requires n_attributes > 1, otherwise it cannot be used
    not_same_object: 'Níl an {attribute_desc_1} ina {attribute_desc_2}.'                                                                    # Requires n_attributes > 1, otherwise it cannot be used
    between: 'Tá cónaí ar an {attribute_desc_2} idir an {attribute_desc_1} agus an {attribute_desc_3}.'                                     # Requires n_objects > 2, otherwise it cannot be used
    not_between: 'Níl cónaí ar an {attribute_desc_1} idir an {attribute_desc_2} agus an {attribute_desc_3}, agus triúr daoine difriúla iad.' # Requires n_objects > 2, otherwise it cannot be used
    multiple_between: 'Tá {n_between} teach idir an {attribute_desc_1} agus an {attribute_desc_2}.'                                         # Requires n_objects > 3, otherwise it cannot be used
    one_between: 'Tá teach amháin idir an {attribute_desc_1} agus an {attribute_desc_2}.'                                                   # Requires n_objects > 2, otherwise it cannot be used

