# Config file for generating zebra puzzles in Irish with the classic "houses" theme.
#
# Cases: attribute_cases = [nom, is, is_not] — no separate case for objects of prepositions.
# Word order: Irish is VSO. To keep the universal "{attribute_desc_1} {attribute_desc_2}." template working
#   across arbitrary category pairings (same_object/not_same_object/same_herring/double_herring/friends),
#   every category's is/is_not form is a BARE NOMINAL PREDICATE (never a finite verb phrase), used with the
#   clue templates "Tá X ina Y."/"Níl X ina Y." (X is/is not [in his] Y). This works because "tá" is an
#   ordinary subject-taking verb: Tá(verb) + X(subject) + ina Y(predicate) is valid VSO order. is and is_not
#   therefore store the SAME bare noun/relative-clause string for every attribute — polarity comes from Tá vs
#   Níl in the clue template, not from the stored string.
# Article placement: the definite article "an" is supplied by the clue templates, not stored in attribute
#   descriptions, to avoid a double article when a preposition (leis an, den, etc.) needs to fuse with it.
# Word-formation: nationalities/jobs = bare noun (nom = is = is_not); pets/fruits = possession relative clause
#   "duine a bhfuil X aige" / "duine a bhfuil dúil aige i X" for nom, "úinéir X" (genitive) for is/is_not;
#   drinks = "duine a ólann X" for nom, "ólaí X" for is/is_not; book genres = "duine a léann X" for nom,
#   "léitheoir X" for is/is_not; hobbies = "duine a Xann" relative clause for BOTH nom and is/is_not, kept
#   verbal/periphrastic rather than an agent noun like "peileadóir", since several hobby agent nouns are also
#   real job titles in Irish and would be ambiguous with the jobs category.
# Simplification (flagged for native speaker review): initial mutation of consonants (séimhiú/urú) and the
#   article's t-/h-prefixation of vowel-initial nouns, triggered by "ina", "leis an", "den", "i", numerals
#   etc., are NOT applied throughout this preliminary config — bare dictionary forms are used after these
#   triggers instead. This is grammatically imperfect but unambiguous and intelligible; a native speaker pass
#   to add correct mutations would meaningfully improve naturalness.
# red_herring_facts use two forms per entry, as for German/Dutch/Basque: Irish's irregular verbs and the
#   copula take distinct dependent forms when embedded under "go"/"gur(b)" (e.g. tá → go bhfuil, is → gur/gurb).
#   The second form already includes its own complementizer, so object_fact does not add "go" itself.
# Gender: Irish "ina" (in his/her/their) and resumptive pronouns are gender-marked. Default to masculine "ina"
#   throughout (consistent with the mutation simplification above), applied uniformly regardless of the
#   described person's actual gender.
# Uncertain forms (flagged for native speaker review): Laitvíoch (Latvian), Faróiseach (Faroese), budragár
#   (budgerigar), feithid bhata (stick insect), ólaí (drinker, -aí agentive neologism), cróiseálann (crochets,
#   neologism), dreapann bollán (boulders), muc ghuine (guinea pig), léim sciála (ski jumping), neamhfhicsean
#   (non-fiction), sú talún fiáin (wild strawberry).

