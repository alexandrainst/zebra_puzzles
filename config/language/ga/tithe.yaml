prompt_replacements:
    # Eclipsis (urú) after the contracted prepositions "ar an", "leis an", "ag an".
    # Consonants (only D, F, B, C, G occur as an attribute description's first letter in this config).
    'ar an D': 'ar an nD'
    'leis an D': 'leis an nD'
    'ag an D': 'ag an nD'
    'ar an d': 'ar an nd'
    'leis an d': 'leis an nd'
    'ag an d': 'ag an nd'
    # B and G must be applied before F and C respectively: eclipsed F ("bhF"/"bhf") starts with the letter
    # that triggers the B rule, and eclipsed C ("gC"/"gc") starts with the letter that triggers the G rule —
    # applying them in the wrong order would eclipse the same word twice (e.g. "ar an bhforbróir" -> wrongly
    # "ar an mbhforbróir" if the B rule ran after the F rule).
    'ar an B': 'ar an mB'
    'leis an B': 'leis an mB'
    'ag an B': 'ag an mB'
    'ar an b': 'ar an mb'
    'leis an b': 'leis an mb'
    'ag an b': 'ag an mb'
    'ar an G': 'ar an nG'
    'leis an G': 'leis an nG'
    'ag an G': 'ag an nG'
    'ar an g': 'ar an ng'
    'leis an g': 'leis an ng'
    'ag an g': 'ag an ng'
    'ar an F': 'ar an bhF'
    'leis an F': 'leis an bhF'
    'ag an F': 'ag an bhF'
    'ar an f': 'ar an bhf'
    'leis an f': 'leis an bhf'
    'ag an f': 'ag an bhf'
    'ar an c': 'ar an gc'
    'leis an c': 'leis an gc'
    'ag an c': 'ag an gc'
    # Eclipsis: vowel-initial words take an "n" prefix (hyphenated before lowercase, unhyphenated before a capital).
    'ar an A': 'ar an nA'
    'leis an A': 'leis an nA'
    'ag an A': 'ag an nA'
    'ar an a': 'ar an n-a'
    'leis an a': 'leis an n-a'
    'ag an a': 'ag an n-a'
    'ar an I': 'ar an nI'
    'leis an I': 'leis an nI'
    'ag an I': 'ag an nI'
    'ar an Í': 'ar an nÍ'
    'leis an Í': 'leis an nÍ'
    'ag an Í': 'ag an nÍ'
    # Lenition (séimhiú) after "den" and "ina".
    'den D': 'den Dh'
    'ina D': 'ina Dh'
    'den d': 'den dh'
    'ina d': 'ina dh'
    'den F': 'den Fh'
    'ina F': 'ina Fh'
    'den f': 'den fh'
    'ina f': 'ina fh'
    'den B': 'den Bh'
    'ina B': 'ina Bh'
    'den b': 'den bh'
    'ina b': 'ina bh'
    'den c': 'den ch'
    'ina c': 'ina ch'
    'den g': 'den gh'
    'ina g': 'ina gh'
    'den m': 'den mh'
    'ina m': 'ina mh'
    # S resists lenition before p/c/m/f/t (Spáinneach); keyed on "Su" (Sualannach) to avoid matching "Sp".
    'den Su': 'den Shu'
    'ina Su': 'ina Shu'
    # Bare article after Tá/Níl/idir/agus/Ólann/Ní ólann/Léann/Ní léann (no contracting preposition):
