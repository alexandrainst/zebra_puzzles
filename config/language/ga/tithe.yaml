    not_at: [nom]
    next_to: [nom, nom]
    not_next_to: [nom, nom]
    just_left_of: [nom, nom]
    just_right_of: [nom, nom]
    left_of: [nom, nom]
    right_of: [nom, nom]
    same_object: [nom, none]
    not_same_object: [nom, none]
    between: [nom, nom, nom]
    not_between: [nom, nom, nom]
    multiple_between: [nom, nom]
    one_between: [nom, nom]

# Per-category overrides for same_object/not_same_object, keyed by the category supplying the predicate
# (attribute_desc_2). Where a category has a single verb shared by every attribute in it, this gives a
# natural verb-initial clause instead of the generic nominal-predicate "Tá X ina Y." pattern. is/is_not for
# these four categories store a bare complement (e.g. "tae", "cat", "in úlla") rather than a nominalized
# "X-drinker"/"X-owner" noun, since that complement is only ever consumed through these templates.
# Categories without an override here (náisiúntachtaí, poist, caitheamh aimsire) keep the "Tá X ina Y."
# pattern — caitheamh aimsire in particular has a different verb per attribute (imríonn/phéinteálann/
# dhreapann/chróiseálann), so a single per-category template does not fit it.
same_object_templates:
    peataí: 'Tá {attribute_desc_2} ag an {attribute_desc_1}.'
    deochanna: 'Ólann an {attribute_desc_1} {attribute_desc_2}.'
    seánraí leabhar: 'Léann an {attribute_desc_1} {attribute_desc_2}.'
    torthaí is fearr: 'Tá dúil ag an {attribute_desc_1} {attribute_desc_2}.'

not_same_object_templates:
    peataí: 'Níl {attribute_desc_2} ag an {attribute_desc_1}.'
    deochanna: 'Ní ólann an {attribute_desc_1} {attribute_desc_2}.'
    seánraí leabhar: 'Ní léann an {attribute_desc_1} {attribute_desc_2}.'
    torthaí is fearr: 'Níl dúil ag an {attribute_desc_1} {attribute_desc_2}.'

prompt_and: agus

prompt_templates:
    - |
        Tá sraith tithe uimhrithe 1 go {n_objects} ó chlé go deas.

        Tá duine ina cónaí i ngach teach, agus tá saintréith ar leith aige i ngach ceann de na catagóirí seo a leanas:

        {chosen_attributes_str}

        Tá an méid seo a leanas ar eolas againn freisin:

        {chosen_clues_str}

        Cé aige a bhfuil na saintréithe seo, agus cén uimhir tí a bhfuil cónaí air?

        Cuir d'fhreagra isteach mar JSON dictionary le do thoil. Caithfidh gach key a bheith ina object_X, áit arb é X uimhir an tí. Caithfidh gach value a bheith ina liosta de na saintréithe ó na catagóirí thuasluaite a bhaineann leis an duine i dteach uimhir X.

        Seo a leanas sampla den formáid freagra:

        {solution_template}
    - |
        Tá sraith tithe uimhrithe 1 go {n_objects} ó chlé go deas.

        Tá duine ina cónaí i ngach teach, agus tá saintréith ar leith aige i gcatagóir {chosen_attributes_str}.

        Tá an méid seo a leanas ar eolas againn freisin:

        {chosen_clues_str}

        Cén saintréith atá ag an duine i ngach teach?

        Cuir d'fhreagra isteach mar JSON dictionary le do thoil. Caithfidh gach key a bheith ina object_X, áit arb é X uimhir an tí. Caithfidh gach value a bheith ina liosta a bhfuil an saintréith ón gcatagóir thuasluaite ann, a bhaineann leis an duine i dteach uimhir X.

        Seo a leanas sampla den formáid freagra:

        {solution_template}

