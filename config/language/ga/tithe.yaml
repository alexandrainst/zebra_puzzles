clues_dict:
    found_at: 'Tá cónaí ar an {attribute_desc} i dteach uimhir {i_object}.'
    not_at: 'Níl cónaí ar an {attribute_desc} i dteach uimhir {i_object}.'
    next_to: 'Tá cónaí ar an {attribute_desc_1} in aice leis an {attribute_desc_2}.'                                                        # Requires n_objects > 2, otherwise use not_same_object
    not_next_to: 'Níl cónaí ar an {attribute_desc_1} in aice leis an {attribute_desc_2}, agus daoine difriúla iad.'                         # Requires n_objects > 2, otherwise it cannot be used
    just_left_of: 'Tá cónaí ar an {attribute_desc_1} díreach ar chlé den {attribute_desc_2}.'                                               # Requires n_objects > 2, otherwise use left_of
    just_right_of: 'Tá cónaí ar an {attribute_desc_1} díreach ar dheis den {attribute_desc_2}.'                                             # Requires n_objects > 2, otherwise use right_of
    left_of: 'Tá cónaí ar an {attribute_desc_1} ar chlé den {attribute_desc_2}.'
    right_of: 'Tá cónaí ar an {attribute_desc_1} ar dheis den {attribute_desc_2}.'
    same_object: 'Tá an {attribute_desc_1} ina {attribute_desc_2}.'                                                                         # Requires n_attributes > 1, otherwise it cannot be used
    not_same_object: 'Níl an {attribute_desc_1} ina {attribute_desc_2}, agus daoine difriúla iad.'                                          # Requires n_attributes > 1, otherwise it cannot be used
    between: 'Tá cónaí ar an {attribute_desc_2} idir an {attribute_desc_1} agus an {attribute_desc_3}.'                                     # Requires n_objects > 2, otherwise it cannot be used
    not_between: 'Níl cónaí ar an {attribute_desc_1} idir an {attribute_desc_2} agus an {attribute_desc_3}, agus triúr daoine difriúla iad.' # Requires n_objects > 2, otherwise it cannot be used
    multiple_between: 'Tá {n_between} teach idir an {attribute_desc_1} agus an {attribute_desc_2}.'                                         # Requires n_objects > 3, otherwise it cannot be used
    one_between: 'Tá teach amháin idir an {attribute_desc_1} agus an {attribute_desc_2}.'                                                   # Requires n_objects > 2, otherwise it cannot be used

clue_cases_dict:
    found_at: [nom]
    not_at: [nom]
    next_to: [nom, nom]
    not_next_to: [nom, nom]
    just_left_of: [nom, nom]
    just_right_of: [nom, nom]
    left_of: [nom, nom]
    right_of: [nom, nom]
    same_object: [nom, none]
    not_same_object: [nom, none]
    between: [nom, nom, nom]
    not_between: [nom, nom, nom]
    multiple_between: [nom, nom]
    one_between: [nom, nom]

prompt_and: agus

prompt_templates:
    - |
        Tá sraith tithe uimhrithe 1 go {n_objects} ó chlé go deas.

        Tá duine ina chónaí i ngach teach, agus tá saintréith ar leith aige i ngach ceann de na catagóirí seo a leanas:

        {chosen_attributes_str}

        Tá an méid seo a leanas ar eolas againn freisin:

        {chosen_clues_str}

        Cé aige a bhfuil na saintréithe seo, agus cén teach ina bhfuil cónaí air?

        Cuir d'fhreagra isteach mar JSON dictionary le do thoil. Caithfidh gach key a bheith ina object_X, áit arb é X uimhir an tí. Caithfidh gach value a bheith ina liosta de na saintréithe ó na catagóirí thuasluaite a bhaineann leis an duine i dteach uimhir X.

        Seo a leanas sampla den fhormáid freagra:

        {solution_template}
    - |
        Tá sraith tithe uimhrithe 1 go {n_objects} ó chlé go deas.

        Tá duine ina chónaí i ngach teach, agus tá saintréith ar leith aige i gcatagóir {chosen_attributes_str}.

        Tá an méid seo a leanas ar eolas againn freisin:

        {chosen_clues_str}

        Cén saintréith atá ag an duine i ngach teach?

        Cuir d'fhreagra isteach mar JSON dictionary le do thoil. Caithfidh gach key a bheith ina object_X, áit arb é X uimhir an tí. Caithfidh gach value a bheith ina liosta ina bhfuil an saintréith ón gcatagóir thuasluaite a bhaineann leis an duine i dteach uimhir X.

        Seo a leanas sampla den fhormáid freagra:

        {solution_template}

