# Config file for generating zebra puzzles in Irish with the classic "houses" theme.
#
# Cases: attribute_cases = [nom, is, is_not] — no separate case for objects of prepositions.
# Word order: Irish is VSO, so the universal "{attribute_desc_1} {attribute_desc_2}." same_object/
#   not_same_object template (subject then predicate, no verb of its own) does not work directly for every
#   category — Irish needs its verb before the subject. Two strategies are used, chosen per category via the
#   generic same_object_templates/not_same_object_templates code hook (see below):
#   1. Categories with an override (peataí, deochanna, seánraí leabhar, torthaí is fearr): a verb-initial
#      template supplies its own verb (Ólann/Léann/Tá dúil ag/Tá...ag), and is/is_not store a bare complement
#      (e.g. "tae", "cat", "in úlla") rather than a nominalized noun.
#   2. Categories without an override (náisiúntachtaí, poist, caitheamh aimsire): is/is_not is a BARE NOMINAL
#      PREDICATE, used with "Tá X ina Y."/"Níl X ina Y." (X is/is not [in his] Y) — valid VSO order since "tá"
#      takes its subject immediately after the verb. is and is_not store the SAME string here; polarity comes
#      from Tá vs Níl in the template. caitheamh aimsire uses this fallback because it has a different verb
#      per attribute (imríonn/phéinteálann/dhreapann/chróiseálann), so no single per-category override
#      template would fit all of it — a single-verb category is a prerequisite for using strategy 1.
# Article placement: the definite article "an" is supplied by the clue templates, not stored in attribute
#   descriptions, to avoid a double article when a preposition (leis an, den, etc.) needs to fuse with it.
# Word-formation: nationalities/jobs = bare noun (nom = is = is_not); pets = "duine a bhfuil X aige" for nom,
#   bare noun for is/is_not (used in "Tá X ag an Y."); drinks = "duine a ólann X" for nom, bare noun for
#   is/is_not (used in "Ólann X Y."); book genres = "duine a léann X" for nom, bare noun for is/is_not (used
#   in "Léann X Y."); fruits = "duine a bhfuil dúil aige i X" for nom, the bare "i X"/"in X" phrase for
#   is/is_not (used in "Tá dúil ag X i Y."); hobbies = "duine a Xann" relative clause for BOTH nom and
#   is/is_not, kept verbal/periphrastic rather than an agent noun like "peileadóir", since several hobby agent
#   nouns are also real job titles in Irish and would be ambiguous with the jobs category.
# Initial mutation (séimhiú/urú) is implemented via prompt_replacements, not code, since every mutation
#   trigger ("ar an", "leis an", "ag an", "den", "ina", and the bare article after Tá/Níl/idir/agus) is fixed
#   literal text already baked into the clue templates. Because prompt_replacements does plain substring
#   replacement and Irish mutation only changes the first letter of the following word, each rule is keyed on
#   "<trigger> <first letter>" (e.g. "den D" -> "den Dh") rather than "<trigger> <whole word>" — the rest of
#   the word is untouched by the replace() call, so one rule per letter covers every attribute sharing that
#   initial, including ones added later. Mutation type per trigger (best effort, flagged for native speaker
#   review — the eclipsis assignment for ar/ag/leis an in particular is not certain):
#     - "ar an", "leis an", "ag an" (contracted prepositions) -> eclipsis (urú)
#     - "den", "ina" -> lenition (séimhiú)
#     - bare "an" after Tá/Níl/idir/agus (no contracting preposition) -> t-prefix on vowel-initial nouns only
#   Only consonants B, C, D, F, G, M and vowels A/I/Í actually occur as the first letter of an attribute
#   description in this config; L, N, R, and vowels never lenite/eclipse the same way and are left unchanged.
#   S resists lenition before p/c/m/f/t (Spáinneach), so the S rule is keyed on "Su" (Sualannach) specifically
#   rather than bare "S", to avoid also matching "Spáinneach". If new attributes starting with P or T are
#   added later, analogous rules should be added following the same pattern.
# red_herring_facts use two forms per entry, as for German/Dutch/Basque: Irish's irregular verbs and the
#   copula take distinct dependent forms when embedded under "go"/"gur(b)" (e.g. tá → go bhfuil, is → gur/gurb).
#   The second form already includes its own complementizer, so object_fact does not add "go" itself.
# Gender: Irish "ina" (in his/her/their) and resumptive pronouns are gender-marked. Default to masculine "ina"
#   throughout (consistent with the mutation simplification above), applied uniformly regardless of the
#   described person's actual gender.
# Uncertain forms (flagged for native speaker review): Laitvíoch (Latvian), Faróiseach (Faroese), budragár
#   (budgerigar), feithid bhata (stick insect), ólaí (drinker, -aí agentive neologism), cróiseálann (crochets,
#   neologism), dreapann bollán (boulders), muc ghuine (guinea pig), léim sciála (ski jumping), neamhfhicsean
#   (non-fiction), sú talún fiáin (wild strawberry).

