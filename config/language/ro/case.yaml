clues_dict:
    found_at: '{attribute_desc} locuiește în casa numărul {i_object}.'
    not_at: '{attribute_desc} nu locuiește în casa numărul {i_object}.'
    next_to: '{attribute_desc_1} locuiește lângă {attribute_desc_2}.'
    not_next_to: '{attribute_desc_1} nu locuiește lângă {attribute_desc_2}, și sunt persoane diferite.'
    just_left_of: '{attribute_desc_1} locuiește imediat la stânga {attribute_desc_2}.'
    just_right_of: '{attribute_desc_1} locuiește imediat la dreapta {attribute_desc_2}.'
    left_of: '{attribute_desc_1} locuiește la stânga {attribute_desc_2}.'
    right_of: '{attribute_desc_1} locuiește la dreapta {attribute_desc_2}.'
    same_object: '{attribute_desc_1} {attribute_desc_2}.'
    not_same_object: '{attribute_desc_1} {attribute_desc_2}.'
    between: '{attribute_desc_2} locuiește între {attribute_desc_1} și {attribute_desc_3}.'
    not_between: '{attribute_desc_1} nu locuiește între {attribute_desc_2} și {attribute_desc_3}, și sunt trei persoane diferite.'
    multiple_between: 'Sunt {n_between} case între {attribute_desc_1} și {attribute_desc_2}.'
    one_between: 'Este o casă între {attribute_desc_1} și {attribute_desc_2}.'

clue_cases_dict:
    found_at: ['nom']
    not_at: ['nom']
    next_to: ['nom', 'nom']
    not_next_to: ['nom', 'nom']
    just_left_of: ['nom', 'gen_dat']
    just_right_of: ['nom', 'gen_dat']
    left_of: ['nom', 'gen_dat']
    right_of: ['nom', 'gen_dat']
    same_object: ['nom', 'none']
    not_same_object: ['nom', 'none']
    between: ['nom', 'nom', 'nom']
    not_between: ['nom', 'nom', 'nom']
    multiple_between: ['nom', 'nom']
    one_between: ['nom', 'nom']

red_herring_clues_dict:
    same_herring: '{attribute_desc} {attribute_desc_herring}.'
    next_to_herring: '{attribute_desc} locuiește lângă {attribute_desc_herring}.'
    double_herring: '{attribute_desc_herring_1} {attribute_desc_herring_2}.'
    fact: '{fact}.'
