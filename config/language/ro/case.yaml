    friends: '{attribute_desc} și {attribute_desc_herring} sunt buni prieteni.'
    herring_found_at: '{attribute_desc_herring} locuiește în casa numărul {i_object}.'
    herring_not_at: '{attribute_desc_herring} nu locuiește în casa numărul {i_object}.'

red_herring_cases_dict:
    same_herring: ['nom', 'none']
    next_to_herring: ['nom', 'nom']
    double_herring: ['nom', 'none']
    fact: ['none']
    object_fact: ['nom', 'none']
    friends: ['nom', 'nom']
    herring_found_at: ['nom']
    herring_not_at: ['nom']

prompt_and: și

prompt_templates:
    - |
        Un șir de case are numerele 1 până la {n_objects} de la stânga la dreapta.

        În fiecare casă locuiește o persoană cu un atribut unic în fiecare din următoarele categorii:

        {chosen_attributes_str}

        De asemenea, știm următoarele:

        {chosen_clues_str}

        Cine are ce atribute și locuiește în care casă?

        Vă rugăm să trimiteți răspunsul dumneavoastră sub forma unui dicționar JSON. Fiecare cheie trebuie să fie object_X, unde X este numărul casei. Fiecare valoare trebuie să fie o listă cu atributele din categoriile menționate mai sus care aparțin persoanei din casa numărul X.

        Urmează un exemplu al formatului de răspuns:

        {solution_template}
    - |
        Un șir de case are numerele 1 până la {n_objects} de la stânga la dreapta.

        În fiecare casă locuiește o persoană cu un atribut unic în categoria {chosen_attributes_str}.

        De asemenea, știm următoarele:

        {chosen_clues_str}

        Ce atribute aparțin persoanei care locuiește în fiecare casă?

        Vă rugăm să trimiteți răspunsul dumneavoastră sub forma unui dicționar JSON. Fiecare cheie trebuie să fie object_X, unde X este numărul casei. Fiecare valoare trebuie să fie o listă care conține atributul din categoria menționată mai sus care aparține persoanei din casa numărul X.

        Urmează un exemplu al formatului de răspuns:

        {solution_template}

prompt_replacements:
    'știe că este distractiv să rezolvi puzzle-uri': 'se bucură să rezolve puzzle-uri'
