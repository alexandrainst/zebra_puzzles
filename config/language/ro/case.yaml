# Config file for generating zebra puzzles in Romanian with the houses theme.
# Gender policy: masculine forms used throughout for unknown-gender persons.
# Case system: gen_dat (genitive-dative syncretism) — used after la stânga/dreapta de.
# Nominative = accusative for definite nouns, so next_to/between use nom forms.

theme: ro_case

attribute_cases: [nom, is, is_not, gen_dat]
red_herring_attribute_cases: [nom, is, gen_dat]

