clues_dict:
    found_at: '{attribute_desc} vive en la casa número {i_object}.'
    not_at: '{attribute_desc} no vive en la casa número {i_object}.'
    next_to: '{attribute_desc_1} vive al lado de {attribute_desc_2}.'
    not_next_to: '{attribute_desc_1} no vive al lado de {attribute_desc_2}, y son personas distintas.'
    just_left_of: '{attribute_desc_1} vive inmediatamente a la izquierda de {attribute_desc_2}.'
    just_right_of: '{attribute_desc_1} vive inmediatamente a la derecha de {attribute_desc_2}.'
    left_of: '{attribute_desc_1} vive a la izquierda de {attribute_desc_2}.'
    right_of: '{attribute_desc_1} vive a la derecha de {attribute_desc_2}.'
    same_object: '{attribute_desc_1} {attribute_desc_2}.'
    not_same_object: '{attribute_desc_1} {attribute_desc_2}.'
    between: '{attribute_desc_2} vive entre {attribute_desc_1} y {attribute_desc_3}.'
    not_between: '{attribute_desc_1} no vive entre {attribute_desc_2} y {attribute_desc_3}, y son tres personas distintas.'
    multiple_between: 'Entre {attribute_desc_1} y {attribute_desc_2} hay {n_between} casas.'
    one_between: 'Entre {attribute_desc_1} y {attribute_desc_2} hay una casa.'

clue_cases_dict:
    found_at: ['nom']
    not_at: ['nom']
    next_to: ['nom', 'nom']
    not_next_to: ['nom', 'nom']
    just_left_of: ['nom', 'nom']
    just_right_of: ['nom', 'nom']
    left_of: ['nom', 'nom']
    right_of: ['nom', 'nom']
    same_object: ['nom', 'none']
    not_same_object: ['nom', 'none']
    between: ['nom', 'nom', 'nom']
    not_between: ['nom', 'nom', 'nom']
    multiple_between: ['nom', 'nom']
    one_between: ['nom', 'nom']

red_herring_clues_dict:
    same_herring: '{attribute_desc} {attribute_desc_herring}.'
    next_to_herring: '{attribute_desc} vive al lado de {attribute_desc_herring}.'
    double_herring: '{attribute_desc_herring_1} {attribute_desc_herring_2}.'
    fact: '{fact}.'
    object_fact: '{attribute_desc} sabe que {fact}.'
    friends: '{attribute_desc} es muy amigo de {attribute_desc_herring}.'
    herring_found_at: '{attribute_desc_herring} vive en la casa número {i_object}.'
    herring_not_at: '{attribute_desc_herring} no vive en la casa número {i_object}.'

red_herring_cases_dict:
    same_herring: ['nom', 'none']
    next_to_herring: ['nom', 'nom']
    double_herring: ['nom', 'none']
    fact: ['none']
    object_fact: ['nom', 'none']
    friends: ['nom', 'nom']
    herring_found_at: ['nom']
    herring_not_at: ['nom']

prompt_and: y

prompt_templates:
    - |
        Una fila de casas está numerada del 1 al {n_objects} de izquierda a derecha.

        En cada casa vive una persona con un atributo único en cada una de las siguientes categorías:

        {chosen_attributes_str}

        También sabemos lo siguiente:

        {chosen_clues_str}

        ¿Quién tiene qué atributos y vive en qué casa?

        Por favor, presenta tu respuesta como un diccionario JSON. Cada clave debe ser object_X, donde X es el número de la casa. Cada valor debe ser una lista de los atributos de las categorías mencionadas que pertenecen a la persona en la casa número X.

        El siguiente es un ejemplo del formato de respuesta:

        {solution_template}
    - |
        Una fila de casas está numerada del 1 al {n_objects} de izquierda a derecha.

        En cada casa vive una persona con un atributo único en la categoría de {chosen_attributes_str}.

        También sabemos lo siguiente:

        {chosen_clues_str}

        ¿Qué atributo tiene la persona que vive en cada casa?

        Por favor, presenta tu respuesta como un diccionario JSON. Cada clave debe ser object_X, donde X es el número de la casa. Cada valor debe ser una lista que contenga el atributo de la categoría mencionada que pertenece a la persona en la casa número X.

        El siguiente es un ejemplo del formato de respuesta:

        {solution_template}

prompt_replacements:
    'de el ': 'del '
    'sabe que resolver acertijos es divertido': 'le gusta resolver acertijos'
