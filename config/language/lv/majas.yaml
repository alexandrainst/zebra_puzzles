prompt_and: un

prompt_templates:
    - |
        Māju rinda ir numurēta no 1 līdz {n_objects} no kreisās uz labo pusi.

        Katrā mājā dzīvo cilvēks ar unikālu īpašību katrā no šīm kategorijām:

        {chosen_attributes_str}

        Mēs arī zinām sekojošo:

        {chosen_clues_str}

        Kam ir kādas īpašības un kurā mājā viņš vai viņa dzīvo?

        Lūdzu, iesniedziet atbildi kā JSON vārdnīcu. Katrai atslēgai jābūt object_X, kur X ir mājas numurs. Katrai vērtībai jābūt iepriekš minēto kategoriju īpašību sarakstam, kas pieder mājā nr. X dzīvojošajai personai.

        Zemāk ir atbildes formāta piemērs:

        {solution_template}
    - |
        Māju rinda ir numurēta no 1 līdz {n_objects} no kreisās uz labo pusi.

        Katrā mājā dzīvo cilvēks ar unikālu īpašību kategorijā {chosen_attributes_str}.

        Mēs arī zinām sekojošo:

        {chosen_clues_str}

        Kāda īpašība ir katras mājas iedzīvotājam?

        Lūdzu, iesniedziet atbildi kā JSON vārdnīcu. Katrai atslēgai jābūt object_X, kur X ir mājas numurs. Katrai vērtībai jābūt sarakstam, kurā ir mājā nr. X dzīvojošās personas īpašība kategorijā {chosen_attributes_str}.

        Zemāk ir atbildes formāta piemērs:

        {solution_template}

prompt_replacements:
    ',.': '.'
    'zina, ka mīklu risināšana ir jautra': 'priecājas par mīklu risināšanu'
