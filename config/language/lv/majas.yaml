# Config file for generating zebra puzzles in Latvian with the houses theme.
# Gender policy: masculine forms used throughout for persons of unknown gender.
# Exception: medmāsa (nurse) is a feminine job title with no standard masculine equivalent.
# Fēru salas demonym: fērietis (pl. fērieši), following the -ietis pattern like latvietis.
# Genitive (gen) is used after: pa kreisi/labi no (left/right of), starpā postposition (between).
# Dative (dat) is used after: blakus (next to).
# Note: multiple_between uses "mājas" (nom pl), correct for n=2-9 in Latvian.
theme: lv_majas

attribute_cases: [nom, is, is_not, gen, dat]
red_herring_attribute_cases: [nom, is, gen, dat]

