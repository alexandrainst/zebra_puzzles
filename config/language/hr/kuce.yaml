# Config file for generating zebra puzzles in Croatian with the houses theme.
# Gender policy: masculine forms used throughout as common gender (standard Croatian usage for unknown gender).
# Exception: medicinska sestra (nurse) is a feminine job title used as-is.
# Genitive (gen) is used after: pored (next to), od (left/right of), između (between).
# Note: multiple_between uses "kuće" (gen sg), correct for n=2,3,4; n≥5 would need "kuća" (gen pl).

theme: hr_kuce

attribute_cases: [nom, is, is_not, gen]
red_herring_attribute_cases: [nom, is, gen]

