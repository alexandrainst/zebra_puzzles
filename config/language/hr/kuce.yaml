clues_dict:
    found_at: "{attribute_desc} živi u kući broj {i_object}."
    not_at: "{attribute_desc} ne živi u kući broj {i_object}."
    next_to: "{attribute_desc_1} živi pored {attribute_desc_2}."
    not_next_to: "{attribute_desc_1} ne živi pored {attribute_desc_2}, a oni su različite osobe."
    just_left_of: "{attribute_desc_1} živi neposredno lijevo od {attribute_desc_2}."
    just_right_of: "{attribute_desc_1} živi neposredno desno od {attribute_desc_2}."
    left_of: "{attribute_desc_1} živi lijevo od {attribute_desc_2}."
    right_of: "{attribute_desc_1} živi desno od {attribute_desc_2}."
    same_object: "{attribute_desc_1} {attribute_desc_2}."
    not_same_object: "{attribute_desc_1} {attribute_desc_2}."
    between: "{attribute_desc_2} živi između {attribute_desc_1} i {attribute_desc_3}."
    not_between: "{attribute_desc_1} ne živi između {attribute_desc_2} i {attribute_desc_3}, a oni su tri različite osobe."
    multiple_between: "Između {attribute_desc_1} i {attribute_desc_2} ima {n_between} kuće."
    one_between: "Između {attribute_desc_1} i {attribute_desc_2} nalazi se jedna kuća."

clue_cases_dict:
    found_at: ["nom"]
    not_at: ["nom"]
    next_to: ["nom", "gen"]
    not_next_to: ["nom", "gen"]
    just_left_of: ["nom", "gen"]
    just_right_of: ["nom", "gen"]
    left_of: ["nom", "gen"]
    right_of: ["nom", "gen"]
    same_object: ["nom", "none"]
    not_same_object: ["nom", "none"]
    between: ["gen", "nom", "gen"]
    not_between: ["nom", "gen", "gen"]
    multiple_between: ["gen", "gen"]
    one_between: ["gen", "gen"]

red_herring_clues_dict:
    same_herring: "{attribute_desc} {attribute_desc_herring}."
    next_to_herring: "{attribute_desc} živi pored {attribute_desc_herring}."
    double_herring: "{attribute_desc_herring_1} {attribute_desc_herring_2}."
    fact: "{fact}."
    object_fact: "{attribute_desc} zna da {fact}."
    friends: "{attribute_desc} i {attribute_desc_herring} su dobri prijatelji."
    herring_found_at: "{attribute_desc_herring} živi u kući broj {i_object}."
    herring_not_at: "{attribute_desc_herring} ne živi u kući broj {i_object}."

red_herring_cases_dict:
    same_herring: ["nom", "none"]
    next_to_herring: ["nom", "gen"]
    double_herring: ["nom", "none"]
    fact: ["none"]
    object_fact: ["nom", "none"]
    friends: ["nom", "nom"]
    herring_found_at: ["nom"]
    herring_not_at: ["nom"]

prompt_and: "i"

prompt_templates:
    - |
        Niz kuća numeriran je od 1 do {n_objects} s lijeva na desno.

        U svakoj kući živi osoba s jedinstvenim atributom u svakoj od sljedećih kategorija:

        {chosen_attributes_str}

        Također znamo sljedeće:

        {chosen_clues_str}

        Tko ima koje atribute i živi u kojoj kući?

        Molimo vas da odgovor dostavite u obliku JSON rječnika. Svaki ključ mora biti object_X gdje je X broj kuće. Svaka vrijednost mora biti lista atributa iz gore navedenih kategorija koji pripadaju osobi koja živi u kući broj X.

        Slijedi primjer formata odgovora:

        {solution_template}
    - |
        Niz kuća numeriran je od 1 do {n_objects} s lijeva na desno.

        U svakoj kući živi osoba s jedinstvenim atributom u kategoriji {chosen_attributes_str}.

        Također znamo sljedeće:

        {chosen_clues_str}

        Koji atributi pripadaju osobi koja živi u svakoj kući?

        Molimo vas da odgovor dostavite u obliku JSON rječnika. Svaki ključ mora biti object_X gdje je X broj kuće. Svaka vrijednost mora biti lista koja sadrži atribut iz gore navedene kategorije koji pripada osobi koja živi u kući broj X.

        Slijedi primjer formata odgovora:

        {solution_template}

prompt_replacements:
    ',.': '.'
    'zna da rješavanje zagonetki je zabavno': 'voli rješavati zagonetke'
