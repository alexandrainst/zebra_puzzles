clues_dict:
    found_at: "{attribute_desc} μένει στο σπίτι αριθμός {i_object}."
    not_at: "{attribute_desc} δεν μένει στο σπίτι αριθμός {i_object}."
    next_to: "{attribute_desc_1} μένει δίπλα σε {attribute_desc_2}."
    not_next_to: "{attribute_desc_1} δεν μένει δίπλα σε {attribute_desc_2}, και είναι διαφορετικά άτομα."
    just_left_of: "{attribute_desc_1} μένει αμέσως αριστερά από {attribute_desc_2}."
    just_right_of: "{attribute_desc_1} μένει αμέσως δεξιά από {attribute_desc_2}."
    left_of: "{attribute_desc_1} μένει αριστερά από {attribute_desc_2}."
    right_of: "{attribute_desc_1} μένει δεξιά από {attribute_desc_2}."
    same_object: "{attribute_desc_1} {attribute_desc_2}."
    not_same_object: "{attribute_desc_1} {attribute_desc_2}."
    between: "{attribute_desc_2} μένει ανάμεσα σε {attribute_desc_1} και σε {attribute_desc_3}."
    not_between: "{attribute_desc_1} δεν μένει ανάμεσα σε {attribute_desc_2} και σε {attribute_desc_3}, και οι τρεις είναι διαφορετικά άτομα."
    multiple_between: "Υπάρχουν {n_between} σπίτια ανάμεσα σε {attribute_desc_1} και σε {attribute_desc_2}."
    one_between: "Υπάρχει ένα σπίτι ανάμεσα σε {attribute_desc_1} και σε {attribute_desc_2}."

clue_cases_dict:
    found_at: ["nom"]
    not_at: ["nom"]
    next_to: ["nom", "acc"]
    not_next_to: ["nom", "acc"]
    just_left_of: ["nom", "acc"]
    just_right_of: ["nom", "acc"]
    left_of: ["nom", "acc"]
    right_of: ["nom", "acc"]
    same_object: ["nom", "none"]
    not_same_object: ["nom", "none"]
    between: ["acc", "nom", "acc"]
    not_between: ["nom", "acc", "acc"]
    multiple_between: ["acc", "acc"]
    one_between: ["acc", "acc"]

red_herring_clues_dict:
    same_herring: "{attribute_desc} {attribute_desc_herring}."
    next_to_herring: "{attribute_desc} μένει δίπλα σε {attribute_desc_herring}."
    double_herring: "{attribute_desc_herring_1} {attribute_desc_herring_2}."
    fact: "{fact}."
    object_fact: "{attribute_desc} ξέρει ότι {fact}."
    friends: "{attribute_desc} και {attribute_desc_herring} είναι πολύ καλοί φίλοι."
    herring_found_at: "{attribute_desc_herring} μένει στο σπίτι αριθμός {i_object}."
    herring_not_at: "{attribute_desc_herring} δεν μένει στο σπίτι αριθμός {i_object}."

red_herring_cases_dict:
    same_herring: ["nom", "none"]
    next_to_herring: ["nom", "acc"]
    double_herring: ["nom", "none"]
    fact: ["none"]
    object_fact: ["nom", "none"]
    friends: ["nom", "nom"]
    herring_found_at: ["nom"]
    herring_not_at: ["nom"]

prompt_templates:
    - |
        Μια σειρά σπιτιών έχει αριθμούς από 1 έως {n_objects} από αριστερά προς τα δεξιά.

        Σε κάθε σπίτι μένει ένα άτομο με ένα μοναδικό χαρακτηριστικό σε κάθε μία από τις παρακάτω κατηγορίες:

        {chosen_attributes_str}

        Γνωρίζουμε επίσης τα εξής:

        {chosen_clues_str}

        Ποιος έχει ποια χαρακτηριστικά και μένει σε ποιο σπίτι;

        Υποβάλετε την απάντησή σας ως JSON dictionary. Κάθε key πρέπει να είναι object_X, όπου X είναι ο αριθμός του σπιτιού. Κάθε value πρέπει να είναι μια λίστα με τα χαρακτηριστικά από τις παραπάνω κατηγορίες που ανήκουν στο άτομο που μένει στο σπίτι αριθμός X.

        Ακολουθεί ένα παράδειγμα της μορφής απάντησης:

        {solution_template}
    - |
        Μια σειρά σπιτιών έχει αριθμούς από 1 έως {n_objects} από αριστερά προς τα δεξιά.

        Σε κάθε σπίτι μένει ένα άτομο με ένα μοναδικό χαρακτηριστικό στην παρακάτω κατηγορία: {chosen_attributes_str}.

        Γνωρίζουμε επίσης τα εξής:

        {chosen_clues_str}

        Ποια χαρακτηριστικά ανήκουν στο άτομο που μένει σε κάθε σπίτι;

        Υποβάλετε την απάντησή σας ως JSON dictionary. Κάθε key πρέπει να είναι object_X, όπου X είναι ο αριθμός του σπιτιού. Κάθε value πρέπει να είναι μια λίστα που περιέχει το χαρακτηριστικό από την παραπάνω κατηγορία που ανήκει στο άτομο που μένει στο σπίτι αριθμός X.

        Ακολουθεί ένα παράδειγμα της μορφής απάντησης:

        {solution_template}

prompt_and: "και"

prompt_replacements:
    "σε τον ": "στον "
