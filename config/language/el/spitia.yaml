# Config file for generating zebra puzzles in Greek with the houses theme.
# Gender policy: masculine for unknown gender (consistent across all attributes and red herring attributes).

theme: el_spitia

# Order of grammatical cases in attribute descriptions for this language.
# Greek positional prepositions σε (next to, between) and από (left of, right of) take the accusative.
# Prompt replacement "σε τον " → "στον " handles the σε + τον contraction for masc. acc. forms.
attribute_cases: [nom, is, is_not, acc]
red_herring_attribute_cases: [nom, is, acc]

