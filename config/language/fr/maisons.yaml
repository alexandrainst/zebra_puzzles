clues_dict:
    found_at: "{attribute_desc} habite dans la maison no. {i_object}."
    not_at: "{attribute_desc} n'habite pas dans la maison no. {i_object}."
    next_to: "{attribute_desc_1} habite à côté de {attribute_desc_2}."
    not_next_to: "{attribute_desc_1} n'habite pas à côté de {attribute_desc_2}, et ce sont deux personnes différentes."
    just_left_of: "{attribute_desc_1} habite juste à gauche de {attribute_desc_2}."
    just_right_of: "{attribute_desc_1} habite juste à droite de {attribute_desc_2}."
    left_of: "{attribute_desc_1} habite à gauche de {attribute_desc_2}."
    right_of: "{attribute_desc_1} habite à droite de {attribute_desc_2}."
    same_object: "{attribute_desc_1} {attribute_desc_2}."
    not_same_object: "{attribute_desc_1} {attribute_desc_2}."
    between: "{attribute_desc_2} habite entre {attribute_desc_1} et {attribute_desc_3}."
    not_between: "{attribute_desc_1} n'habite pas entre {attribute_desc_2} et {attribute_desc_3}, et ce sont trois personnes différentes."
    multiple_between: "Il y a {n_between} maisons entre {attribute_desc_1} et {attribute_desc_2}."
    one_between: "Il y a une maison entre {attribute_desc_1} et {attribute_desc_2}."

clue_cases_dict:
    found_at: ['nom']
    not_at: ['nom']
    next_to: ['nom', 'nom']
    not_next_to: ['nom', 'nom']
    just_left_of: ['nom', 'nom']
    just_right_of: ['nom', 'nom']
