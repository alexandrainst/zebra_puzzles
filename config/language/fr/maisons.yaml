red_herring_cases_dict:
    same_herring: ['nom', 'none']
    next_to_herring: ['nom', 'nom']
    double_herring: ['nom', 'none']
    fact: ['none']
    object_fact: ['nom', 'none']
    friends: ['nom', 'nom']
    herring_found_at: ['nom']
    herring_not_at: ['nom']

prompt_and: et

# There should be a space before ':' in French, which we add later with prompt_replacements.
prompt_templates:
    - |
        Une rangée de maisons porte les numéros 1 à {n_objects} de gauche à droite.

        Dans chaque maison vit une personne ayant un attribut unique dans chacune des catégories suivantes:

        {chosen_attributes_str}

        On sait également ce qui suit:

        {chosen_clues_str}

        Qui a quels attributs et habite dans quelle maison ?

        Veuillez soumettre votre réponse sous la forme d'un dictionnaire JSON. Chaque clé doit être object_X, où X est le numéro de la maison. Chaque valeur doit être une liste des attributs des catégories mentionnées ci-dessus appartenant à la personne habitant la maison no. X.

        Voici un exemple du format de réponse:

        {solution_template}
    - |
        Une rangée de maisons porte les numéros 1 à {n_objects} de gauche à droite.

        Dans chaque maison vit une personne ayant un attribut unique dans la catégorie suivante: {chosen_attributes_str}.

        On sait également ce qui suit:

        {chosen_clues_str}

        Quels attributs appartiennent à la personne habitant chaque maison ?

        Veuillez soumettre votre réponse sous la forme d'un dictionnaire JSON. Chaque clé doit être object_X, où X est le numéro de la maison. Chaque valeur doit être une liste contenant l'attribut de la catégorie mentionnée ci-dessus appartenant à la personne habitant la maison no. X.

        Voici un exemple du format de réponse:

        {solution_template}

prompt_replacements:
    "de le ": "du "
    "que il ": "qu'il "
    ": ": " : "
    ":\n": " :\n"
