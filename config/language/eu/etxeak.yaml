# Config file for generating zebra puzzles in Basque with the "houses" theme.
#
# Cases: attribute_cases = [abs, erg, is, is_not, gen]
# Ergative-absolutive alignment: copular/intransitive subjects → abs; transitive subjects → erg (via attribute_subject_cases)
# Postpositions: ondoan/ezkerrean/eskuinean/artean all follow genitive → gen case for positional second args
# Word-formation: nationalities=demonym noun (-ar suffix), jobs=bare noun, pets=compound possessive (X-ren jabea) + edun,
#                 drinks=compound -edalea + edaten du, literature=compound -irakurlea + irakurtzen du,
#                 fruits=-zalea compound + maite du, hobbies=compound -egilea/-jokalaria/-zalea + egiten/jokatzen du
# Uncertain forms flagged for native speaker review: Faroe Islands/Netherlands demonyms, perikito (budgerigar),
#   hagaxka-intsektu (stick insect), grosella beltza (blackcurrant), gantxoa (crochet),
#   txerrindel (guinea pig), ski saltoa (ski jumping)
# Gender: Basque has no grammatical gender — all forms are gender-neutral naturally.

theme: eu_etxeak

# Order of grammatical cases in attribute descriptions.
# Format: [absolutive, ergative, predicate-is, predicate-is_not, genitive]
attribute_cases: [abs, erg, is, is_not, gen]
red_herring_attribute_cases: [abs, erg, is, gen]

# attribute_subject_cases: when a category's attribute is the predicate (desc_2) in same_object/not_same_object,
# the subject (desc_1) takes the specified case. Copular predicates → abs; transitive predicates → erg.
attribute_subject_cases:
    Nazionalitateak: abs
    Lanbideak: abs
    Maskotak: erg
    Edariak: erg
    Liburu-generoak: erg
    Zaletasunak: erg
    Fruta gogokoenak: erg

