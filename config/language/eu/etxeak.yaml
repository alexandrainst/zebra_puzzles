# Clues (SOV word order; postpositions follow genitive)
clues_dict:
    found_at: '{attribute_desc} {i_object}. etxean bizi da.'
    not_at: '{attribute_desc} ez da {i_object}. etxean bizi.'
    next_to: '{attribute_desc_1} {attribute_desc_2} ondoan bizi da.'                                                                              # Requires n_objects > 2, otherwise use not_same_object
    not_next_to: '{attribute_desc_1} ez da {attribute_desc_2} ondoan bizi, eta pertsona desberdinak dira.'                                         # Requires n_objects > 2, otherwise it cannot be used
    just_left_of: '{attribute_desc_1} {attribute_desc_2} ezkerreko etxean bertan bizi da.'                                                        # Requires n_objects > 2, otherwise use left_of
    just_right_of: '{attribute_desc_1} {attribute_desc_2} eskuineko etxean bertan bizi da.'                                                       # Requires n_objects > 2, otherwise use right_of
    left_of: '{attribute_desc_1} {attribute_desc_2} ezkerrean bizi da.'
    right_of: '{attribute_desc_1} {attribute_desc_2} eskuinean bizi da.'
    same_object: '{attribute_desc_1} {attribute_desc_2}.'                                                                                         # Requires n_attributes > 1, otherwise it cannot be used
    not_same_object: '{attribute_desc_1} {attribute_desc_2}.'                                                                                     # Requires n_attributes > 1, otherwise it cannot be used
    between: '{attribute_desc_2} {attribute_desc_1} eta {attribute_desc_3} artean bizi da.'                                                       # Requires n_objects > 2, otherwise it cannot be used
    not_between: '{attribute_desc_1} ez da {attribute_desc_2} eta {attribute_desc_3} artean bizi, eta hiru pertsona desberdinak dira.'             # Requires n_objects > 2, otherwise it cannot be used
    multiple_between: '{attribute_desc_1} eta {attribute_desc_2} artean {n_between} etxe daude.'                                                  # Requires n_objects > 3, otherwise it cannot be used
    one_between: '{attribute_desc_1} eta {attribute_desc_2} artean etxe bat dago.'                                                                # Requires n_objects > 2, otherwise it cannot be used

# abs = absolutive (intransitive/copular subject, positional subject)
# erg = ergative (transitive subject — overridden per category by attribute_subject_cases in same_object/not_same_object)
# gen = genitive (after postpositions ondoan/ezkerrean/eskuinean/artean)
# none = is/is_not predicate form (resolved at runtime)
# Note: between: desc_1 and desc_3 are flanking (gen), desc_2 is the middle person (abs subject)
clue_cases_dict:
    found_at: [abs]
    not_at: [abs]
    next_to: [abs, gen]
    not_next_to: [abs, gen]
    just_left_of: [abs, gen]
    just_right_of: [abs, gen]
    left_of: [abs, gen]
    right_of: [abs, gen]
    same_object: [abs, none]
    not_same_object: [abs, none]
    between: [gen, abs, gen]
    not_between: [abs, gen, gen]
    multiple_between: [gen, gen]
    one_between: [gen, gen]

prompt_and: eta

prompt_templates:
    - |
        Etxe-ilara bat 1etik {n_objects}era dago zenbakitua, ezkerretik eskuinera.

        Etxe bakoitzean pertsona bat bizi da, eta honako kategoria bakoitzeko ezaugarri bakarra du:

        {chosen_attributes_str}

        Honako hauek ere badakizkigu:

        {chosen_clues_str}

        Nork zein ezaugarri dituen eta zein etxetan bizi den asmatzen al duzu?

        Erantzuna JSON dictionary gisa bidali mesedez. Key bakoitza object_X da, X etxe-zenbakia delarik. Balio bakoitza aurretik aipatutako kategorietako ezaugarrien zerrenda bat da, X etxean bizi den pertsonari dagozkionak.

        Hona hemen erantzun-formatuaren adibide bat:

        {solution_template}
    - |
        Etxe-ilara bat 1etik {n_objects}era dago zenbakitua, ezkerretik eskuinera.

        Etxe bakoitzean pertsona bat bizi da, {chosen_attributes_str} kategorian ezaugarri bakarra duela.

        Honako hauek ere badakizkigu:

        {chosen_clues_str}

        Zein ezaugarri dagokio etxe bakoitzeko pertsonari?

        Erantzuna JSON dictionary gisa bidali mesedez. Key bakoitza object_X da, X etxe-zenbakia delarik. Balio bakoitza zerrenda bat da, {chosen_attributes_str} kategoriari dagokion ezaugarria duena, X etxean bizi den pertsonaren.

        Hona hemen erantzun-formatuaren adibide bat:

        {solution_template}

# Red herrings
# Format: [abs, erg, is, gen]
# erg is used for object_fact (badaki is transitive → ergative subject); also keeps index positions aligned with attribute_cases.

red_herring_clues_dict:
    same_herring: '{attribute_desc} {attribute_desc_herring}.'
    next_to_herring: '{attribute_desc} {attribute_desc_herring} ondoan bizi da.'
    double_herring: '{attribute_desc_herring_1} {attribute_desc_herring_2}.'
    fact: '{fact}.'
    object_fact: '{attribute_desc} badaki {fact}.'
    friends: '{attribute_desc} eta {attribute_desc_herring} lagunak dira.'
    herring_found_at: '{attribute_desc_herring} {i_object}. etxean bizi da.'
    herring_not_at: '{attribute_desc_herring} ez da {i_object}. etxean bizi.'

red_herring_cases_dict:
