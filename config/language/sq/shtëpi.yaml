prompt_and: dhe

prompt_templates:
    - |
        Një rresht shtëpish ka numrat 1 deri në {n_objects} nga e majta në të djathtë.

        Në çdo shtëpi jeton një person me atribut unik në secilën nga kategoritë e mëposhtme:

        {chosen_attributes_str}

        Ne gjithashtu dimë sa vijon:

        {chosen_clues_str}

        Kush ka cilat atribute dhe jeton në cilën shtëpi?

        Ju lutemi paraqisni përgjigjen tuaj si fjalor JSON. Çdo çelës duhet të jetë object_X ku X është numri i shtëpisë. Çdo vlerë duhet të jetë listë e atributeve nga kategoritë e sipërpërmendura që i përkasin personit në shtëpinë numër X.

        Shembulli i mëposhtëm tregon formatin e përgjigjes:

        {solution_template}
    - |
        Një rresht shtëpish ka numrat 1 deri në {n_objects} nga e majta në të djathtë.

        Në çdo shtëpi jeton një person me atribut unik në kategorinë {chosen_attributes_str}.

        Ne gjithashtu dimë sa vijon:

        {chosen_clues_str}

        Cilat atribute i përkasin personit që jeton në çdo shtëpi?

        Ju lutemi paraqisni përgjigjen tuaj si fjalor JSON. Çdo çelës duhet të jetë object_X ku X është numri i shtëpisë. Çdo vlerë duhet të jetë listë me atributin nga kategoria e sipërpërmendur që i përket personit në shtëpinë numër X.

        Shembulli i mëposhtëm tregon formatin e përgjigjes:

        {solution_template}

prompt_replacements:
    'di që është argëtuese të zgjidhësh enigma': 'di që enigmat janë argëtuese'
