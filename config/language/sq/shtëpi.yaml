# Config file for generating zebra puzzles in Albanian with the houses theme.
# Gender policy: masculine forms used throughout for unknown-gender persons.
# Case system: gen_dat (genitive-dative syncretism) — used after positional prepositions
# (pranë, ndërmjet, në të majtë/djathtë të). Nominative = subject form (with definite article).

