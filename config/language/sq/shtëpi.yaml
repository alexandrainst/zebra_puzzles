    next_to: '{attribute_desc_1} jeton pranë {attribute_desc_2}.'
    not_next_to: '{attribute_desc_1} nuk jeton pranë {attribute_desc_2}, dhe janë njerëz të ndryshëm.'
    just_left_of: '{attribute_desc_1} jeton menjëherë në të majtë të {attribute_desc_2}.'
    just_right_of: '{attribute_desc_1} jeton menjëherë në të djathtë të {attribute_desc_2}.'
    left_of: '{attribute_desc_1} jeton në të majtë të {attribute_desc_2}.'
    right_of: '{attribute_desc_1} jeton në të djathtë të {attribute_desc_2}.'
    same_object: '{attribute_desc_1} {attribute_desc_2}.'
    not_same_object: '{attribute_desc_1} {attribute_desc_2}.'
    between: '{attribute_desc_2} jeton ndërmjet {attribute_desc_1} dhe {attribute_desc_3}.'
    not_between: '{attribute_desc_1} nuk jeton ndërmjet {attribute_desc_2} dhe {attribute_desc_3}, dhe janë tre njerëz të ndryshëm.'
    multiple_between: 'Ndërmjet {attribute_desc_1} dhe {attribute_desc_2} ka {n_between} shtëpi.'
    one_between: 'Ndërmjet {attribute_desc_1} dhe {attribute_desc_2} ka një shtëpi.'

