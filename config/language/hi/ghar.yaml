# Clues
clues_dict:
    found_at: '{attribute_desc} घर नंबर {i_object} में रहता है।'
    not_at: '{attribute_desc} घर नंबर {i_object} में नहीं रहता है।'
    next_to: '{attribute_desc_1} {attribute_desc_2} के बगल में रहता है।'                                       # Requires n_objects > 2, otherwise use not_same_object
    not_next_to: '{attribute_desc_1} {attribute_desc_2} के बगल में नहीं रहता है, और वे दो अलग-अलग लोग हैं।'      # Requires n_objects > 2, otherwise it cannot be used
    just_left_of: '{attribute_desc_1} {attribute_desc_2} के ठीक बाएं रहता है।'                                  # Requires n_objects > 2, otherwise use left_of
    just_right_of: '{attribute_desc_1} {attribute_desc_2} के ठीक दाएं रहता है।'                                 # Requires n_objects > 2, otherwise use right_of
    left_of: '{attribute_desc_1} {attribute_desc_2} के बाएं रहता है।'
    right_of: '{attribute_desc_1} {attribute_desc_2} के दाएं रहता है।'
    same_object: '{attribute_desc_1} {attribute_desc_2}।'                                                      # Requires n_attributes > 1, otherwise it cannot be used
    not_same_object: '{attribute_desc_1} {attribute_desc_2}।'                                                  # Requires n_attributes > 1, otherwise it cannot be used
    between: '{attribute_desc_2} {attribute_desc_1} और {attribute_desc_3} के बीच में रहता है।'                  # Requires n_objects > 2, otherwise it cannot be used
    not_between: '{attribute_desc_1} {attribute_desc_2} और {attribute_desc_3} के बीच में नहीं रहता है, और वे तीन अलग-अलग लोग हैं।' # Requires n_objects > 2, otherwise it cannot be used
    multiple_between: '{attribute_desc_1} और {attribute_desc_2} के बीच में {n_between} घर हैं।'                 # Requires n_objects > 3, otherwise it cannot be used
    one_between: '{attribute_desc_1} और {attribute_desc_2} के बीच में एक घर है।'                                # Requires n_objects > 2, otherwise it cannot be used

clue_cases_dict:
    found_at: ['nom']
    not_at: ['nom']
    next_to: ['nom', 'obl']
    not_next_to: ['nom', 'obl']
    just_left_of: ['nom', 'obl']
    just_right_of: ['nom', 'obl']
    left_of: ['nom', 'obl']
    right_of: ['nom', 'obl']
    same_object: ['nom', 'none']
    not_same_object: ['nom', 'none']
    between: ['obl', 'nom', 'obl']
    not_between: ['nom', 'obl', 'obl']
    multiple_between: ['obl', 'obl']
    one_between: ['obl', 'obl']

# Prompt
prompt_and: और

prompt_templates:
    - |
        घरों की एक पंक्ति बाएं से दाएं 1 से {n_objects} तक क्रमांकित है।

