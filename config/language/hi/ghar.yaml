# Config file for generating zebra puzzles in Hindi with the "houses" (घर) theme.
#
# Ergativity avoidance: Hindi has split ergativity — the ergative marker "ने" appears ONLY on transitive
#   verbs in the perfective aspect (completed past), never in habitual/present constructions. Every clue
#   and attribute in this config is phrased in the present habitual (करता है / पीता है / पढ़ता है, etc.),
#   which is imperfective, so ergative marking never triggers anywhere. This means — unlike Basque, which
#   is ergative unconditionally and needed a code change (attribute_subject_cases) — Hindi needed NO code
#   changes at all; it was purely a config addition. The one red herring using a completed-past-feeling verb
#   ("has been to Canada") uses "गया हुआ है" (an experiential-perfect built on जाना, "to go") — जाना is
#   INTRANSITIVE, and ergativity only ever applies to transitive verbs, so this is also safe.
# Gender: masculine used as the default/common gender throughout for unknown-gender persons (matches this
#   repo's precedent for Czech/Russian/Ukrainian). All habitual verb forms use -ता है (masculine singular);
#   habitual-present verb agreement is with the SUBJECT regardless of any object's own gender (unlike
#   perfective/ergative constructions, where the verb would agree with the object instead — moot here
#   since perfective is never used).
# Cases: attribute_cases = [nom, is, is_not, obl]. Every Hindi positional postposition used here (के बगल
#   में "next to", के बाएं/दाएं "left/right of", के बीच में "between") is a grammaticalized के-based compound
#   that requires its preceding noun phrase in the OBLIQUE case, regardless of that NP's own gender — so
#   only one extra case ("obl") is needed, not a case per postposition.
# Word-formation: nationalities/pets/genres/hobbies/fruits use compact head-noun compounds where only ONE
#   word actually changes between nom and obl (निवासी "resident" and मालिक "owner" are consonant/ई-final
#   and don't inflect, but the embedded का possessive marker shifts का→के under obl; वाला-agentive suffixes
#   — पीनेवाला "drinker", पढ़नेवाला "reader", करनेवाला/खेलनेवाला "doer/player", पसंद करनेवाला "liker" — always
#   inflect वाला→वाले under obl regardless of what they attach to, since वाला itself is grammatically the
#   head of the compound). Jobs are bare nouns ending in ई or a consonant (नानबाई, मंत्री, शिक्षक, etc.),
#   none of which have a distinct oblique form, so their obl slot is identical to nom — this is correct,
#   not an oversight. Proper nouns (country names) resist the usual -आ oblique shift even where they end in
#   आ (e.g. लातविया stays लातविया, not लातविये) — a general exception for foreign/proper nouns in Hindi.
# Red herrings use वाला-nominalization exclusively (not जो-relative clauses): a जो...वह/उस correlative clause
#   would need to be word-order-split around the postposition ("जो X है, उस व्यक्ति के बगल में"), which
#   cannot be expressed by this framework's flat {attribute_desc} template substitution. वाला instead
#   compresses the whole relative clause into a single ordinary noun that takes oblique मार्किंग exactly
#   like any other noun (वाला→वाले), so it composes correctly everywhere. Two red herrings needed a minor
#   semantic softening to fit this pattern: "old_animal" simplifies "old for its species" to just "old"
#   (बूढ़ा), and the mango/Canada items stay accurate but read slightly more compressed than a discursive
#   relative clause would.
# Nurse/sister: job "nurse" is नर्स (a distinct loanword, not the native word for "sister"), avoiding the
#   nurse/sister homograph trap this skill flags for other languages — in Hindi/Indian English the risk
#   would actually run through "सिस्टर" (a colloquial loanword some Indian hospitals use for nurses), so
#   नर्स + बहन (the fully native word for sister, used only for the red herring) keeps the two unambiguous.
# Punctuation: uses the Devanagari danda "।" as sentence-final punctuation (set via prompt_full_stop — the
#   same config key added for Chinese/Japanese). Otherwise Hindi punctuation is close to European
#   conventions: standard ASCII comma with spaces, spaced "and" (और), and the ASCII "?" for questions
#   (already supported by format_datasets.py from the Chinese work) — so prompt_comma/prompt_and_spacing/
#   prompt_colon are all left at their defaults, unlike Chinese/Japanese.
# No numeral classifier needed: unlike Chinese (栋) and Japanese (軒), Hindi numerals attach directly to
#   nouns with no obligatory counter word, so "2 घर" ("2 houses") needs no extra marking in multiple_between.
# Uncertain forms (flagged for native speaker review): बजरीगर (budgerigar), छड़ी कीट (stick insect, a
#   descriptive compound rather than an attested single term), ब्लैककरंट (blackcurrant), जंगली स्ट्रॉबेरी
#   (wild strawberry), हेरिंग (herring, the fish — not commonly known/named in India).

theme: hi_ghar

attribute_cases: [nom, is, is_not, obl]
red_herring_attribute_cases: [nom, is, obl]

prompt_full_stop: ।

