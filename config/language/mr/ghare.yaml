# Config file for generating zebra puzzles in Marathi with the "houses" (घरे) theme.
#
# Ergativity: ने-ergative only applies in perfective past; all clues use present habitual.
# Habitual present is a complete predicate on its own (stem+तो/ते, gender-agreeing) — unlike Hindi, no
#   separate copula needed. Negation uses stem+त+नाही (gender-invariant). Nominal predicates (jobs/
#   nationalities) still need आहे, negated by नाही replacing it entirely ("शिक्षक नाही", not "आहे नाही").
# Gender: masculine default. Is-form predicates
#   are static strings that can't pick a gender variant per paired subject in same_herring/double_herring.
#   Tried feminine व्यक्ती for kanada/aamba — internally consistent alone, but broke once paired with
#   another entry's masculine predicate ("...व्यक्ती मानतो", not "मानते"). A
#   proper fix needs subject-conditioned predicate selection. Unsure if needed.
# Cases: [nom, is, is_not, obl]. शेजारी/डावीकडे/उजवीकडे/दरम्यान all take an oblique argument + genitive
#   linker च्या (confirmed for डावीकडे/उजवीकडे; assumed for शेजारी/दरम्यान — flag for native review, शेजारी is
#   also attested glued directly without च्या in some fixed expressions).
# Word-formation: Fruits use पसंत करणे ("prefer", transitive) not आवडणे (dative-
#   experiencer), to keep the subject nominative. Unsure if changes are needed.
# Red herrings use the red_herring_subject_cases/same_herring_templates/double_herring_templates
#   mechanism: बहीण→ला (kinship), लाल_केस→चे (attributive, plural आहेत), टॅटू→जवळ (physical
#   possession) — all three need the subject in oblique case.
# object_fact uses जाणतो ("knows", transitive) not माहीत आहे (dative-experiencer) — same fruits rationale.
# Nurse/sister: नर्स (loanword) not परिचारिका (native, feminine) — avoids the gender clash.
# Checked against Wikipedia: फेरो द्वीपसमूह (Faroe Islands) and गोगलगाय (snail, feminine by analogy with गाय
#   "cow"); हेरिंग transliteration found via Hindi Wikipedia's identical borrowing.
# More uncertain: ससा (rabbit) oblique सशा; बजरीगर, काडी कीटक, ब्लॅककरंट, रानटी
#   स्ट्रॉबेरी (no Marathi Wikipedia article found); whether शेजारी/दरम्यान truly need च्या the way
#   डावीकडे/उजवीकडे do; whether दरम्यान should use collective यांच्या instead of per-argument च्या.

