        हँडबॉल: ['हँडबॉल खेळणारा', 'हँडबॉल खेळतो', 'हँडबॉल खेळत नाही', 'हँडबॉल खेळणाऱ्या']

    आवडती फळे:
        सफरचंद: ['सफरचंद पसंत करणारा', 'सफरचंद पसंत करतो', 'सफरचंद पसंत करत नाही', 'सफरचंद पसंत करणाऱ्या']
