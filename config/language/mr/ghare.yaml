        रानटी स्ट्रॉबेरी: ['रानटी स्ट्रॉबेरी पसंत करणारा', 'रानटी स्ट्रॉबेरी पसंत करतो', 'रानटी स्ट्रॉबेरी पसंत करत नाही', 'रानटी स्ट्रॉबेरी पसंत करणाऱ्या']  # uncertain — verify botanical term

# Clues
clues_dict:
    found_at: '{attribute_desc} घर क्रमांक {i_object} मध्ये राहतो।'
    not_at: '{attribute_desc} घर क्रमांक {i_object} मध्ये राहत नाही।'
    next_to: '{attribute_desc_1} {attribute_desc_2}च्या शेजारी राहतो।'                                          # Requires n_objects > 2, otherwise use not_same_object
    not_next_to: '{attribute_desc_1} {attribute_desc_2}च्या शेजारी राहत नाही, आणि ते दोन वेगवेगळे लोक आहेत।'     # Requires n_objects > 2, otherwise it cannot be used
    just_left_of: '{attribute_desc_1} {attribute_desc_2}च्या अगदी डावीकडे राहतो।'                                # Requires n_objects > 2, otherwise use left_of
    just_right_of: '{attribute_desc_1} {attribute_desc_2}च्या अगदी उजवीकडे राहतो।'                               # Requires n_objects > 2, otherwise use right_of
    left_of: '{attribute_desc_1} {attribute_desc_2}च्या डावीकडे राहतो।'
    right_of: '{attribute_desc_1} {attribute_desc_2}च्या उजवीकडे राहतो।'
    same_object: '{attribute_desc_1} {attribute_desc_2}।'                                                      # Requires n_attributes > 1, otherwise it cannot be used
    not_same_object: '{attribute_desc_1} {attribute_desc_2}।'                                                  # Requires n_attributes > 1, otherwise it cannot be used
    between: '{attribute_desc_2} {attribute_desc_1}च्या आणि {attribute_desc_3}च्या दरम्यान राहतो।'               # Requires n_objects > 2, otherwise it cannot be used
    not_between: '{attribute_desc_1} {attribute_desc_2}च्या आणि {attribute_desc_3}च्या दरम्यान राहत नाही, आणि ते तीन वेगवेगळे लोक आहेत।' # Requires n_objects > 2, otherwise it cannot be used
    multiple_between: '{attribute_desc_1}च्या आणि {attribute_desc_2}च्या दरम्यान {n_between} घरे आहेत।'          # Requires n_objects > 3, otherwise it cannot be used
    one_between: '{attribute_desc_1}च्या आणि {attribute_desc_2}च्या दरम्यान एक घर आहे।'                          # Requires n_objects > 2, otherwise it cannot be used

