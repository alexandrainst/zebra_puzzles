# Config file for generating zebra puzzles in Marathi with the "houses" (घरे) theme.
#
# Ergativity avoidance: like Hindi, Marathi has split ergativity (ने marks transitive subjects only in
#   the perfective/completed-past aspect). Every clue here is phrased in the present habitual, which is
#   imperfective, so ergative marking never triggers — no code changes needed for this, same as Hindi.
# Present habitual structurally differs from Hindi: Marathi's habitual verb form (stem + तो/ते, agreeing
#   with subject gender/number) is a COMPLETE predicate on its own — unlike Hindi, it needs NO separate
#   copula (है-equivalent). E.g. "तो चहा पितो" ("he drinks tea") has no auxiliary. Negation instead uses
#   stem + त + नाही ("पीत नाही" = "does not drink"), which is gender-invariant in the 3rd person, unlike
#   the positive form. NOMINAL predicates (jobs/nationalities: "is a teacher") still need the copula आहे
#   (negated as नाही, replacing आहे entirely rather than combining with it, e.g. "शिक्षक नाही" not
#   "शिक्षक आहे नाही").
# Gender: masculine used as default/common gender throughout (matches this repo's precedent for
#   Hindi/Czech/Russian). This barely matters here in practice: आहे/नाही don't inflect for gender (only
#   number, and every subject here is singular), so only the -तो/-ते habitual verb ending needs to stay
#   consistently masculine (-तो) — Marathi's third grammatical gender (neuter) never surfaces as extra
#   config complexity because it only appears on object nouns, not on the person-referring expressions.
# Cases: attribute_cases = [nom, is, is_not, obl]. Positional postpositions (शेजारी "next to", डावीकडे/
#   उजवीकडे "left/right of", दरम्यान "between") all take an oblique-marked argument followed by the
#   genitive linker च्या (confirmed for उजवीकडे/डावीकडे via "पोस्ट ऑफिसच्या उजवीकडे" = "to the right of the
#   post office"); assumed to generalize the same way to शेजारी/दरम्यान for consistency with the rest of
#   this config — flagged as worth native confirmation, since शेजारी is also attested glued directly to an
#   oblique noun without च्या in some fixed expressions (शाळेशेजारी = "next to the school").
# Word-formation: nationalities use "Xचा रहिवासी" (resident of X, रहिवासी is ई-final and invariant across
#   nom/obl, so only the embedded चा→च्या genitive marker shows the oblique shift — exactly analogous to
#   Hindi's का→के). Jobs are bare nouns, all ई/consonant-final and so invariant in oblique (matches Hindi).
#   Pets use "Xचा मालक" (owner of X, मालिक's Marathi cognate मालक, also invariant) + "X पाळतो"/"X पाळत नाही"
#   (raises/keeps as a pet — the improved verb this repo settled on for Hindi pets/old_animal, not रखता है/
#   ठेवतो, which reads like "keeps an object"). Drinks/genres/hobbies/fruits use the -णारा participial
#   agentive suffix (पिणारा "drinker", वाचणारा "reader", करणारा/खेळणारा "doer/player", पसंत करणारा "liker") —
#   Marathi's structural equivalent of Hindi's वाला, but declining -णारा→-णाऱ्या in oblique (NOT -णारे —
#   Marathi's masculine -आ oblique shift is -आ→-या, confirmed via मुलगा→मुलग्या, unlike Hindi's -आ→-े).
#   Fruits deliberately use पसंत करणे ("to prefer", a regular transitive verb, calqued into Marathi from
#   Hindi/Urdu and commonly used) rather than the more colloquial आवडणे ("to please"), which is an
#   experiencer construction requiring a DATIVE-marked subject (Xला आवडतो) — avoided for the same reason
#   Hindi avoided "X को पसंद है", to keep every subject uniformly nominative.
# Red herrings reuse वाला (also used in Marathi for descriptive compounds like दूधवाला "milkman") for their
#   nom/obl referring forms, declining वाला→वाल्या (same -आ→-या shift as -णारा). Three red herrings — बहीण
#   "sister", लाल_केस "red hair", टॅटू "tattoo" — use the `red_herring_subject_cases`/`same_herring_templates`/
#   `double_herring_templates` mechanism (added to red_herring_selection.py for Hindi in this same repo, no
#   further code changes needed) so their same_herring/double_herring predicate can use Marathi's natural
#   possessive constructions instead of a generic "keeps X" verb: बहीण uses dative ला ("Xला बहीण आहे" —
#   kinship possession), लाल_केस uses genitive चे ("Xचे केस लाल आहेत" — attributive description, केस is
#   grammatically plural so आहेत agrees plural), टॅटू uses जवळ ("X जवळ टॅटू आहे" — physical-object
#   possession). All three postpositions require the subject in oblique case, same reasoning as Hindi.
# object_fact uses जाणतो ("knows", a regular transitive verb) rather than the more colloquial माहीत आहे
#   ("is known to"), which is a dative-experiencer construction (Xला माहीत आहे) — same rationale as fruits.
# Nurse/sister: job "nurse" is नर्स (English loanword, gender-neutral in this usage), not the native
#   feminine term परिचारिका, both avoiding a gendered-noun clash with the masculine-default policy and any
#   accidental overlap with बहीण (sister, a completely distinct native word — no ambiguity risk here).
# Punctuation: same as Hindi — Devanagari danda "।" via prompt_full_stop; otherwise standard comma+spaces,
#   spaced "आणि" ("and"), ASCII "?" for questions (already supported by format_datasets.py). No numeral
#   classifier needed for counting houses (matches Hindi, unlike Chinese/Japanese).
# Uncertain forms (flagged for native speaker review): ससा (rabbit) oblique सशा — declension pattern for
#   this specific word not independently confirmed; गोगलगाय (snail) gender/oblique गोगलगाई — inherited
#   declension from गाय "cow" assumed but not confirmed; बजरीगर (budgerigar), काडी कीटक (stick insect, a
#   descriptive compound rather than a confirmed single term), ब्लॅककरंट (blackcurrant), रानटी स्ट्रॉबेरी
#   (wild strawberry), हेरिंग (herring, the fish — not commonly known/named in India), फेरो द्वीपसमूह
#   (Faroe Islands, name/demonym-adjacent spelling). Also flagged: whether शेजारी/दरम्यान truly need the
#   explicit च्या linker the way डावीकडे/उजवीकडे demonstrably do, or whether some accept direct oblique
#   attachment (see cases note above); and whether दरम्यान should instead use a single collective यांच्या
#   ("of them", referring to both flanking arguments jointly) rather than marking each argument with its
#   own च्या individually, as this config currently does for consistency with next_to/left_of/right_of.

theme: mr_ghare

attribute_cases: [nom, is, is_not, obl]
red_herring_attribute_cases: [nom, is, obl]

prompt_full_stop: ।

attributes:

    राष्ट्रीयत्वे:
        डेन्मार्क: ['डेन्मार्कचा रहिवासी', 'डेन्मार्कचा रहिवासी आहे', 'डेन्मार्कचा रहिवासी नाही', 'डेन्मार्कच्या रहिवासी']
        स्वीडन: ['स्वीडनचा रहिवासी', 'स्वीडनचा रहिवासी आहे', 'स्वीडनचा रहिवासी नाही', 'स्वीडनच्या रहिवासी']
        लॅटव्हिया: ['लॅटव्हियाचा रहिवासी', 'लॅटव्हियाचा रहिवासी आहे', 'लॅटव्हियाचा रहिवासी नाही', 'लॅटव्हियाच्या रहिवासी']
        फ्रान्स: ['फ्रान्सचा रहिवासी', 'फ्रान्सचा रहिवासी आहे', 'फ्रान्सचा रहिवासी नाही', 'फ्रान्सच्या रहिवासी']
        स्पेन: ['स्पेनचा रहिवासी', 'स्पेनचा रहिवासी आहे', 'स्पेनचा रहिवासी नाही', 'स्पेनच्या रहिवासी']
        इटली: ['इटलीचा रहिवासी', 'इटलीचा रहिवासी आहे', 'इटलीचा रहिवासी नाही', 'इटलीच्या रहिवासी']
        नॉर्वे: ['नॉर्वेचा रहिवासी', 'नॉर्वेचा रहिवासी आहे', 'नॉर्वेचा रहिवासी नाही', 'नॉर्वेच्या रहिवासी']
        फेरो द्वीपसमूह: ['फेरो द्वीपसमूहचा रहिवासी', 'फेरो द्वीपसमूहचा रहिवासी आहे', 'फेरो द्वीपसमूहचा रहिवासी नाही', 'फेरो द्वीपसमूहच्या रहिवासी']  # uncertain — verify name/demonym
        नेदरलँड्स: ['नेदरलँड्सचा रहिवासी', 'नेदरलँड्सचा रहिवासी आहे', 'नेदरलँड्सचा रहिवासी नाही', 'नेदरलँड्सच्या रहिवासी']
        आइसलँड: ['आइसलँडचा रहिवासी', 'आइसलँडचा रहिवासी आहे', 'आइसलँडचा रहिवासी नाही', 'आइसलँडच्या रहिवासी']
        युनायटेड किंग्डम: ['युनायटेड किंग्डमचा रहिवासी', 'युनायटेड किंग्डमचा रहिवासी आहे', 'युनायटेड किंग्डमचा रहिवासी नाही', 'युनायटेड किंग्डमच्या रहिवासी']

    व्यवसाय:
        बेकर: ['बेकर', 'बेकर आहे', 'बेकर नाही', 'बेकर']
        मंत्री: ['मंत्री', 'मंत्री आहे', 'मंत्री नाही', 'मंत्री']
        पोलीस अधिकारी: ['पोलीस अधिकारी', 'पोलीस अधिकारी आहे', 'पोलीस अधिकारी नाही', 'पोलीस अधिकारी']
        नर्स: ['नर्स', 'नर्स आहे', 'नर्स नाही', 'नर्स']
        शिक्षक: ['शिक्षक', 'शिक्षक आहे', 'शिक्षक नाही', 'शिक्षक']
        सॉफ्टवेअर डेव्हलपर: ['सॉफ्टवेअर डेव्हलपर', 'सॉफ्टवेअर डेव्हलपर आहे', 'सॉफ्टवेअर डेव्हलपर नाही', 'सॉफ्टवेअर डेव्हलपर']
        दुकान सहाय्यक: ['दुकान सहाय्यक', 'दुकान सहाय्यक आहे', 'दुकान सहाय्यक नाही', 'दुकान सहाय्यक']

    पाळीव प्राणी:
        कुत्रा: ['कुत्र्याचा मालक', 'कुत्रा पाळतो', 'कुत्रा पाळत नाही', 'कुत्र्याच्या मालक']
        मांजर: ['मांजराचा मालक', 'मांजर पाळतो', 'मांजर पाळत नाही', 'मांजराच्या मालक']
        ससा: ['सशाचा मालक', 'ससा पाळतो', 'ससा पाळत नाही', 'सशाच्या मालक']  # uncertain — verify oblique सशा
        झेब्रा: ['झेब्राचा मालक', 'झेब्रा पाळतो', 'झेब्रा पाळत नाही', 'झेब्राच्या मालक']
        बजरीगर: ['बजरीगरचा मालक', 'बजरीगर पाळतो', 'बजरीगर पाळत नाही', 'बजरीगरच्या मालक']  # uncertain — verify term
        गोगलगाय: ['गोगलगाईचा मालक', 'गोगलगाय पाळतो', 'गोगलगाय पाळत नाही', 'गोगलगाईच्या मालक']  # uncertain — verify gender/oblique
        काडी कीटक: ['काडी कीटकाचा मालक', 'काडी कीटक पाळतो', 'काडी कीटक पाळत नाही', 'काडी कीटकाच्या मालक']  # uncertain — verify term

    पेये:
        रस: ['रस पिणारा', 'रस पितो', 'रस पीत नाही', 'रस पिणाऱ्या']
        कॉफी: ['कॉफी पिणारा', 'कॉफी पितो', 'कॉफी पीत नाही', 'कॉफी पिणाऱ्या']
        दूध: ['दूध पिणारा', 'दूध पितो', 'दूध पीत नाही', 'दूध पिणाऱ्या']
        स्मूदी: ['स्मूदी पिणारा', 'स्मूदी पितो', 'स्मूदी पीत नाही', 'स्मूदी पिणाऱ्या']
        कोको: ['कोको पिणारा', 'कोको पितो', 'कोको पीत नाही', 'कोको पिणाऱ्या']
        चहा: ['चहा पिणारा', 'चहा पितो', 'चहा पीत नाही', 'चहा पिणाऱ्या']
        कोल्ड ड्रिंक: ['कोल्ड ड्रिंक पिणारा', 'कोल्ड ड्रिंक पितो', 'कोल्ड ड्रिंक पीत नाही', 'कोल्ड ड्रिंक पिणाऱ्या']

    आवडत्या पुस्तकांचे प्रकार:
        अकल्पित साहित्य: ['अकल्पित साहित्य वाचणारा', 'अकल्पित साहित्य वाचतो', 'अकल्पित साहित्य वाचत नाही', 'अकल्पित साहित्य वाचणाऱ्या']
        गुन्हेगारी कथा: ['गुन्हेगारी कथा वाचणारा', 'गुन्हेगारी कथा वाचतो', 'गुन्हेगारी कथा वाचत नाही', 'गुन्हेगारी कथा वाचणाऱ्या']
        फँटसी: ['फँटसी वाचणारा', 'फँटसी वाचतो', 'फँटसी वाचत नाही', 'फँटसी वाचणाऱ्या']
        विज्ञान कथा: ['विज्ञान कथा वाचणारा', 'विज्ञान कथा वाचतो', 'विज्ञान कथा वाचत नाही', 'विज्ञान कथा वाचणाऱ्या']
        भयकथा: ['भयकथा वाचणारा', 'भयकथा वाचतो', 'भयकथा वाचत नाही', 'भयकथा वाचणाऱ्या']
        कविता: ['कविता वाचणारा', 'कविता वाचतो', 'कविता वाचत नाही', 'कविता वाचणाऱ्या']
        प्रेमकथा: ['प्रेमकथा वाचणारा', 'प्रेमकथा वाचतो', 'प्रेमकथा वाचत नाही', 'प्रेमकथा वाचणाऱ्या']

    छंद:
        बोल्डरिंग: ['बोल्डरिंग करणारा', 'बोल्डरिंग करतो', 'बोल्डरिंग करत नाही', 'बोल्डरिंग करणाऱ्या']
