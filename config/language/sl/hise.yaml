# Config file for generating zebra puzzles in Slovenian with the houses theme.
# Gender policy: masculine forms used throughout for unknown-gender persons.
# Exception: medicinska sestra (nurse) is a feminine job title used as-is.
# Cases: attribute_cases = [nom, is, is_not, gen, inst]
# Preposition → case: poleg→gen, od (levo/desno od)→gen, med→inst
# Word-formation: nationalities=demonym nouns, pets=lastnik+gen / ima+acc,
#   drinks/hobbies/literature/fruits=tisti, ki [verb], / tistega, ki / tistim, ki
# Note: multiple_between uses "so {n} hiše" (nom pl, correct for n=3,4);
#   n=2 should be "sta 2 hiši" (dual), n≥5 needs "hiš" (gen pl).
# Note: not_next_to uses "sta pa različni osebi" (dual, 2 persons);
#   not_between uses "so pa tri različne osebe" (pl, 3 persons).

theme: sl_hise

attribute_cases: [nom, is, is_not, gen, inst]
red_herring_attribute_cases: [nom, is, gen, inst]

