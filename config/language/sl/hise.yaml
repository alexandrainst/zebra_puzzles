clues_dict:
    found_at: "{attribute_desc} živi v hiši številka {i_object}."
    not_at: "{attribute_desc} ne živi v hiši številka {i_object}."
    next_to: "{attribute_desc_1} živi poleg {attribute_desc_2}."
    not_next_to: "{attribute_desc_1} ne živi poleg {attribute_desc_2}, sta pa različni osebi."
    just_left_of: "{attribute_desc_1} živi tik levo od {attribute_desc_2}."
    just_right_of: "{attribute_desc_1} živi tik desno od {attribute_desc_2}."
    left_of: "{attribute_desc_1} živi levo od {attribute_desc_2}."
    right_of: "{attribute_desc_1} živi desno od {attribute_desc_2}."
    same_object: "{attribute_desc_1} {attribute_desc_2}."
    not_same_object: "{attribute_desc_1} {attribute_desc_2}."
    between: "{attribute_desc_2} živi med {attribute_desc_1} in {attribute_desc_3}."
    not_between: "{attribute_desc_1} ne živi med {attribute_desc_2} in {attribute_desc_3}, so pa tri različne osebe."
    multiple_between: "Med {attribute_desc_1} in {attribute_desc_2} so {n_between} hiše."
    one_between: "Med {attribute_desc_1} in {attribute_desc_2} je ena hiša."

clue_cases_dict:
    found_at: ["nom"]
    not_at: ["nom"]
    next_to: ["nom", "gen"]
    not_next_to: ["nom", "gen"]
    just_left_of: ["nom", "gen"]
    just_right_of: ["nom", "gen"]
    left_of: ["nom", "gen"]
    right_of: ["nom", "gen"]
    same_object: ["nom", "none"]
    not_same_object: ["nom", "none"]
    between: ["inst", "nom", "inst"] # Exception: The first element here is the second in the clue template (attribute_desc_1 is the first).
    not_between: ["nom", "inst", "inst"]
    multiple_between: ["inst", "inst"]
    one_between: ["inst", "inst"]

red_herring_clues_dict:
    same_herring: "{attribute_desc} {attribute_desc_herring}."
    next_to_herring: "{attribute_desc} živi poleg {attribute_desc_herring}."
    double_herring: "{attribute_desc_herring_1} {attribute_desc_herring_2}."
    fact: "{fact}."
    object_fact: "{attribute_desc} ve, da {fact}."
    friends: "{attribute_desc} in {attribute_desc_herring} sta dobra prijatelja."
    herring_found_at: "{attribute_desc_herring} živi v hiši številka {i_object}."
    herring_not_at: "{attribute_desc_herring} ne živi v hiši številka {i_object}."

red_herring_cases_dict:
    same_herring: ["nom", "none"]
    next_to_herring: ["nom", "gen"]
    double_herring: ["nom", "none"]
    fact: ["none"]
    object_fact: ["nom", "none"]
    friends: ["nom", "nom"]
    herring_found_at: ["nom"]
    herring_not_at: ["nom"]

prompt_templates:
    - |
        Vrsta hiš je oštevilčena od 1 do {n_objects} od leve proti desni.

        V vsaki hiši živi oseba z edinstveno lastnostjo v vsaki od naslednjih kategorij:

        {chosen_attributes_str}

        Prav tako vemo naslednje:

        {chosen_clues_str}

        Kdo ima katere lastnosti in živi v kateri hiši?

        Prosimo, oddajte odgovor v obliki JSON slovarja. Vsak ključ mora biti object_X, kjer je X številka hiše. Vsaka vrednost mora biti seznam lastnosti iz zgoraj navedenih kategorij, ki pripadajo osebi, ki živi v hiši številka X.

        Spodaj je primer formata odgovora:

        {solution_template}
    - |
        Vrsta hiš je oštevilčena od 1 do {n_objects} od leve proti desni.

        V vsaki hiši živi oseba z edinstveno lastnostjo v kategoriji {chosen_attributes_str}.

        Prav tako vemo naslednje:

        {chosen_clues_str}

        Katere lastnosti ima oseba, ki živi v vsaki hiši?

        Prosimo, oddajte odgovor v obliki JSON slovarja. Vsak ključ mora biti object_X, kjer je X številka hiše. Vsaka vrednost mora biti seznam, ki vsebuje lastnost iz zgoraj navedene kategorije, ki pripada osebi, ki živi v hiši številka X.

        Spodaj je primer formata odgovora:

        {solution_template}

prompt_and: "in"

prompt_replacements:
    ',.': '.'
    ',, sta': ', sta'
    ',, so': ', so'
    've, da reševanje ugank je zabavno': 'uživa v reševanju ugank'
