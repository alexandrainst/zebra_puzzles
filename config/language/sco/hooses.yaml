# Config file for generating zebra puzzles in Scots with the classic "houses" theme.
#
# Scots is West Germanic and very close to English: SVO order, no grammatical gender, no case system beyond
#   English's own (attribute_cases = [nom, is, is_not], same as English — no extra cases needed since none of
#   the positional prepositions, o/tae/atween/niest tae, govern anything beyond the plain noun form).
# Negation uses the Scots "-nae" clitic on auxiliaries (disnae/isnae) rather than English "not".
# Word-formation follows English closely: nationalities/jobs = "the X", pets/drinks = "the X owner/drinker" +
#   "haes/drinks X", book genres = "the X reader" + "reads X", hobbies/fruits = "the body that Xs" (using
#   "body" = person, a very common Scots word), matching English's pattern category-for-category.
# Spelling follows common literary Scots conventions (hoose, ken, wi, aboot, etc.) rather than any single
#   fixed standard, since Scots orthography is not fully standardised.
# Uncertain forms (flagged for native speaker review, common but not dictionary-confirmed in this pass):
#   baxter (baker), polisman (police officer).

theme: sco_hooses

attribute_cases: [nom, is, is_not]
red_herring_attribute_cases: [nom, is]

attributes:

