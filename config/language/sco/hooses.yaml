        rabbit: ['the rabbit owner', 'haes a rabbit', 'disnae hae a rabbit']
        zebra: ['the zebra owner', 'haes a zebra', 'disnae hae a zebra']
        budgerigar: ['the budgie owner', 'haes a budgie', 'disnae hae a budgie']
        snail: ['the snail owner', 'haes a snail', 'disnae hae a snail']
        stick insect: ['the stick insect owner', 'haes a stick insect', 'disnae hae a stick insect']

    drinks:
        juice: ['the juice drinker', 'drinks juice', 'disnae drink juice']
        coffee: ['the coffee drinker', 'drinks coffee', 'disnae drink coffee']
        milk: ['the milk drinker', 'drinks milk', 'disnae drink milk']
        smoothie: ['the smoothie drinker', 'drinks smoothies', 'disnae drink smoothies']
        cocoa: ['the cocoa drinker', 'drinks cocoa', 'disnae drink cocoa']
        tea: ['the tea drinker', 'drinks tea', 'disnae drink tea']
        soda: ['the ginger drinker', 'drinks ginger', 'disnae drink ginger']

    favourite book genres:
        non-fiction: ['the non-fiction reader', 'reads non-fiction', 'disnae read non-fiction']
        crime: ['the crime reader', 'reads crime novels', 'disnae read crime novels']
        fantasy: ['the fantasy reader', 'reads fantasy', 'disnae read fantasy']
        science fiction: ['the science fiction reader', 'reads science fiction', 'disnae read science fiction']
        horror: ['the horror reader', 'reads horror', 'disnae read horror']
        poetry: ['the poetry reader', 'reads poetry', 'disnae read poetry']
        romance: ['the romance reader', 'reads romance novels', 'disnae read romance novels']

    hobbies:
