        banana: ['the body that loes bananas', 'loes bananas', 'disnae like bananas']
        strawberry: ['the body that loes strawberries', 'loes strawberries', 'disnae like strawberries']
        blackcurrant: ['the body that loes blackcurrants', 'loes blackcurrants', 'disnae like blackcurrants']
        wild strawberry: ['the body that loes wild strawberries', 'loes wild strawberries', 'disnae like wild strawberries']

# Clues (SVO word order, same as English)
clues_dict:
    found_at: '{attribute_desc} bides in hoose nummer {i_object}.'
    not_at: '{attribute_desc} disnae bide in hoose nummer {i_object}.'
    next_to: '{attribute_desc_1} bides niest tae {attribute_desc_2}.'                                                                        # Requires n_objects > 2, otherwise use not_same_object
    not_next_to: '{attribute_desc_1} disnae bide niest tae {attribute_desc_2}, an they ur different fowk.'                                   # Requires n_objects > 2, otherwise it cannot be used
    just_left_of: '{attribute_desc_1} bides jist tae the left o {attribute_desc_2}.'                                                         # Requires n_objects > 2, otherwise use left_of
    just_right_of: '{attribute_desc_1} bides jist tae the richt o {attribute_desc_2}.'                                                       # Requires n_objects > 2, otherwise use right_of
    left_of: '{attribute_desc_1} bides tae the left o {attribute_desc_2}.'
    right_of: '{attribute_desc_1} bides tae the richt o {attribute_desc_2}.'
    same_object: '{attribute_desc_1} {attribute_desc_2}.'                                                                                    # Requires n_attributes > 1, otherwise it cannot be used
    not_same_object: '{attribute_desc_1} {attribute_desc_2}.'                                                                                # Requires n_attributes > 1, otherwise it cannot be used
    between: '{attribute_desc_2} bides atween {attribute_desc_1} an {attribute_desc_3}.'                                                     # Requires n_objects > 2, otherwise it cannot be used
    not_between: '{attribute_desc_1} disnae bide atween {attribute_desc_2} an {attribute_desc_3}, an they ur three different fowk.'          # Requires n_objects > 2, otherwise it cannot be used
    multiple_between: 'There ar {n_between} hooses atween {attribute_desc_1} an {attribute_desc_2}.'                                         # Requires n_objects > 3, otherwise it cannot be used
    one_between: 'There is ane hoose atween {attribute_desc_1} an {attribute_desc_2}.'                                                       # Requires n_objects > 2, otherwise it cannot be used

clue_cases_dict:
    found_at: ['nom']
    not_at: ['nom']
    next_to: ['nom', 'nom']
    not_next_to: ['nom', 'nom']
    just_left_of: ['nom', 'nom']
    just_right_of: ['nom', 'nom']
    left_of: ['nom', 'nom']
    right_of: ['nom', 'nom']
    same_object: ['nom', 'none']
    not_same_object: ['nom', 'none']
    between: ['nom', 'nom', 'nom']
    not_between: ['nom', 'nom', 'nom']
    multiple_between: ['nom', 'nom']
    one_between: ['nom', 'nom']

prompt_and: an

prompt_templates:
    - |
        A row o hooses is nummered 1 tae {n_objects} fae left tae richt.

        In ilka hoose bides a body wi a unique attribute in ilka ane o the follaein categories:

        {chosen_attributes_str}

        We ken the follaein forby:

        {chosen_clues_str}

        Wha haes whit attributes an bides in whit hoose?

        Please sen yer answer as a JSON dictionary. Ilka key maun be object_X, whaur X is the hoose nummer. Ilka value maun be a leet o the attributes fae the foresaid categories that belang tae the body in hoose nummer X.

        Here's an example o the answer format:

        {solution_template}
    - |
        A row o hooses is nummered 1 tae {n_objects} fae left tae richt.

        In ilka hoose bides a body wi a unique attribute in the category o {chosen_attributes_str}.

        We ken the follaein forby:

        {chosen_clues_str}

        Whit attribute belangs tae the body in ilka hoose?

        Please sen yer answer as a JSON dictionary. Ilka key maun be object_X, whaur X is the hoose nummer. Ilka value maun be a leet containin the attribute fae the foresaid category that belangs tae the body in hoose nummer X.

        Here's an example o the answer format:

        {solution_template}

# Red herrings
red_herring_clues_dict:
    same_herring: '{attribute_desc} {attribute_desc_herring}.'
    next_to_herring: '{attribute_desc} bides niest tae {attribute_desc_herring}.'
    double_herring: '{attribute_desc_herring_1} {attribute_desc_herring_2}.'
    fact: '{fact}.'
    object_fact: '{attribute_desc} kens that {fact}.'
    friends: '{attribute_desc} is guid pals wi {attribute_desc_herring}.'
    herring_found_at: '{attribute_desc_herring} bides in hoose nummer {i_object}.'
    herring_not_at: '{attribute_desc_herring} disnae bide in hoose nummer {i_object}.'

red_herring_cases_dict:
    same_herring: ['nom', 'none']
    next_to_herring: ['nom', 'nom']
    double_herring: ['nom', 'none']
    fact: ['none']
    object_fact: ['nom', 'none']
    friends: ['nom', 'nom']
    herring_found_at: ['nom']
    herring_not_at: ['nom']

