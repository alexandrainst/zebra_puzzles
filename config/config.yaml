# Config file for generating zebra puzzles

# Possible combinations of languages and themes:
# da/huse
# da/smoerrebroed
# de/Hauser
# en/houses
# fo/hus
# is/husum
# nb/hus
# nl/huizen
# nn/hus
# sv/hus
# fi/talot
# fr/maisons
# hu/hazak
# pt/casas
# el/spitia
# uk/budynky
# pl/domy
# lt/namai
# ro/case
# bg/kashti
# bs/kuce
# sq/shtepi
# be/damy
# ca/cases
# es/casas
# hr/kuce
# et/majad
# lv/majas
# sr/kuce
# sk/domy
# sl/hise
# cs/domy
# it/case
# eu/etxeak
# ga/tithe
# sco/hooses
# lb/haiser
# mk/kukji
# fy/huzen
# zh/fangzi
# ru/doma
# ja/ie
# hi/ghar

defaults:
  - language: en/houses
  - override hydra/job_logging: custom
  - _self_

# Model
# The LLM model to evaluate on the puzzles.
model : gpt-4o-mini

# Whether to generate new LLM responses or only evaluate existing ones when running evaluate.py
generate_new_responses: False

# Whether to automatically confirm overwriting existing files/datasets and publishing to Hugging Face Hub, instead of asking interactively
auto_confirm: False

# The current data folder used for generating, evaluating, and plotting
# We typically want 128 train, 128 validation, and 1024 test puzzles.
data_folder: data

# Folder for loading training data
data_folder_train: data_train

# Folder for loading validation data
data_folder_val: data_val

# Folder for loading test data
data_folder_test: data_test

# Number of puzzles to generate
n_puzzles: 128

# Objects e.g. houses
n_objects: 2

# Attributes e.g. pets
n_attributes: 3

# Weights for the clue types
# The weights are used to determine the probability of generating each type of clue. The distribution of accepted clue types will be different, as redundant clues are removed.
clue_weights:
    found_at: 1
    not_at: 1
    next_to: 1
    not_next_to: 1
    just_left_of: 1
    just_right_of: 1
    left_of: 1
    right_of: 1
    same_object: 1
    not_same_object: 1
    between: 1
    not_between: 1
    multiple_between: 1
    one_between: 1

# Number of red herring clues generated
n_red_herring_clues: 5

# Number of red herrings clues evaluated
# This must be less than or equal to n_red_herring_clues, as clues can be removed but not added during evaluation.
n_red_herring_clues_evaluated: 5

# Weights for the red herring clues
# The weights are used to determine the probability of generating each type of red herring clue.
red_herring_clue_weights:
    same_herring: 1
    next_to_herring: 1
    double_herring: 1
    fact: 1
    object_fact: 1
    friends: 1
    herring_found_at: 1
    herring_not_at: 1

# Name of the full dataset on Hugging Face Hub that might contain multiple subsets of different languages or themes.
huggingface_id: alexandrainst/zebra_puzzles
